# Reusable pkgdown workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: pkgdown
#   on:
#     push: { branches: [main, master] }
#     pull_request: { branches: [main, master] }
#     release: { types: [published] }
#     workflow_dispatch:
#   jobs:
#     pkgdown:
#       uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@v0.4
#       ## No `secrets:` block needed -- this workflow uses only the automatic
#       ## GITHUB_TOKEN. Drop any `secrets: inherit` a caller still has.
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
#         post-install: |
#           pak::pkg_install("ropensci/NLMR")
name: pkgdown

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # Stock Noble apt (replicates reproducible). The ubuntugis-unstable PPA
      # used by install-spatial-deps installs libgdal37, which is ABI-incompatible
      # with the binaries in Posit's noble cache and breaks geospatial loads.
      - name: Install spatial deps (Linux, stock Noble)
        # Short acquire timeouts + retries so a stalled GitHub apt mirror
        # (azure.archive.ubuntu.com intermittently goes Ign) aborts in ~30s and
        # fails over instead of hanging the step. See R-CMD-check.yaml for the
        # observed failure.
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -f -y || true
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --fix-missing \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://PredictiveEcology.r-universe.dev/'
          Ncpus: 2
          # Posit's noble binaries are built against stock libgdal34 (matches the
          # apt step). r-universe terra is built against libgdal37 and won't load
          # here -- so prefer RSPM, same as R-CMD-check.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            ${{ inputs.extra-packages }}
          needs: website

      - name: Install additional package dependencies
        if: ${{ inputs.post-install != '' }}
        run: ${{ inputs.post-install }}
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
