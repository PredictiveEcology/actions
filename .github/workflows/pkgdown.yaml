# Reusable pkgdown workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: pkgdown
#   on:
#     push: { branches: [main, master] }
#     pull_request: { branches: [main, master] }
#     release: { types: [published] }
#     workflow_dispatch:
#   jobs:
#     pkgdown:
#       uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@main
#       ## No `secrets:` block needed -- this workflow uses only the automatic
#       ## GITHUB_TOKEN. Drop any `secrets: inherit` a caller still has.
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
#         post-install: |
#           pak::pkg_install("ropensci/NLMR")
name: pkgdown

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # Delegated to install-spatial-deps rather than inlined. The comment this
      # replaces said the action was unusable because it added the
      # ubuntugis-unstable PPA (libgdal37, ABI-incompatible with Posit's
      # binaries); the action dropped that PPA, so the objection is gone and the
      # duplicated apt logic was only a source of drift -- which is how that PPA
      # survived in one copy for months after the workflows had rejected it.
      # The action also retries/caps each apt call and reports the geospatial
      # ABI, which the dependency cache key below needs.
      - name: Install geospatial system dependencies
        id: spatial
        uses: PredictiveEcology/actions/install-spatial-deps@main

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://PredictiveEcology.r-universe.dev/'
          Ncpus: 2
          # Prefer P3M: it serves binaries built for the runner's own Ubuntu
          # release, so they match the system GDAL installed above. r-universe
          # builds against a different release, which can leave terra/sf linked
          # to a GDAL soname this runner does not have. Deliberately phrased
          # without version numbers so it survives the next runner bump.
          use-public-rspm: true

      # Cache key carries the geospatial ABI, same as setup-r-deps (#48).
      # Without it the restore-key is just <os>-<R>-<arch>-1-, which matches the
      # most recent library ANY job saved in that pool -- including one linked
      # against a GDAL this runner no longer has. That restores cleanly and
      # fails later at dlopen (CBMutils#91). The `ubuntu-latest` flip to Ubuntu
      # 26.04 moves GDAL 3.8/libgdal34 -> 3.12/libgdal38 org-wide on one day,
      # which is precisely that scenario (#57).
      # Falls back to a bare "1" -- upstream's own default -- when there is no
      # ABI, so those keys stay byte-identical to today's.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: ${{ steps.spatial.outputs.abi && format('1-{0}', steps.spatial.outputs.abi) || '1' }}
          extra-packages: |
            any::pkgdown
            local::.
            ${{ inputs.extra-packages }}
          needs: website

      - name: Install additional package dependencies
        if: ${{ inputs.post-install != '' }}
        run: ${{ inputs.post-install }}
        shell: Rscript {0}

      ## After the dependency install on purpose, so a `Depends-on:` PR overrides it.
      - uses: PredictiveEcology/actions/install-depends-on@main

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
