# Reusable pkgdown workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: pkgdown
#   on:
#     push: { branches: [main, master] }
#     pull_request: { branches: [main, master] }
#     release: { types: [published] }
#     workflow_dispatch:
#   jobs:
#     pkgdown:
#       uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@main
#       ## No `secrets:` block needed -- this workflow uses only the automatic
#       ## GITHUB_TOKEN. Drop any `secrets: inherit` a caller still has.
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
#         post-install: |
#           pak::pkg_install("ropensci/NLMR")
name: pkgdown

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""
      cache-version:
        description: >-
          Bump to invalidate the dependency cache. Exposed so a caller can
          clear a poisoned library (e.g. a terra built against the wrong
          libgdal) without a PR to this repo -- a stale cache was the actual
          root cause of both historical libgdal ABI incidents, and until now
          this workflow had no way to evict one.
        type: string
        default: "1"
      extra-repositories:
        description: >-
          Extra repositories for setup-r. Defaults to the PredictiveEcology
          r-universe, which is what this workflow hardcoded before it was
          exposed -- so existing callers are unaffected. Worth setting to "" for
          a package whose dependencies are all on CRAN: r-universe serves
          development versions, so leaving it on risks documenting the package
          against a dependency version CRAN will never have.
        type: string
        default: "https://PredictiveEcology.r-universe.dev/"
      system-deps:
        description: >-
          Install the geospatial system libraries (GDAL/GEOS/PROJ/udunits).
          Set false for a pure-R package. NOT derived from the DESCRIPTION on
          purpose: reproducible and SpaDES.project reach terra/sf/raster/geodata
          through Suggests only, so any rule based on hard dependencies gets
          exactly those packages wrong.
        type: boolean
        default: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    ## Not read-only, unlike the other three reusable workflows here: the deploy
    ## step below pushes the rendered site to the gh-pages branch with
    ## GITHUB_TOKEN. Scoped to this job, and to `contents` only.
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # pandoc, the geospatial system libraries, R, and the dependency
      # install, all from one place. This workflow used to carry its own copy
      # of each: a bare setup-pandoc with no retry, a second (differently
      # spelled) apt block, and a hardcoded extra-repositories. Routing through
      # the composite also picks up the RcppParallel/oneTBB rebuild probe,
      # which only R-CMD-check had.
      #
      # `pandoc` is deliberately NOT exposed as an input here: pkgdown cannot
      # render a site without it, so a caller turning it off would only be
      # buying a confusing failure.
      - uses: PredictiveEcology/actions/setup-r-deps@main
        with:
          cache-version: ${{ inputs.cache-version }}
          extra-repositories: ${{ inputs.extra-repositories }}
          system-deps: ${{ inputs.system-deps }}
          post-install: ${{ inputs.post-install }}
          # `local::.` installs the package itself, which pkgdown needs in
          # order to load it; `needs: website` pulls Config/Needs/website.
          needs: website
          extra-packages: |
            any::pkgdown
            local::.
            ${{ inputs.extra-packages }}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
