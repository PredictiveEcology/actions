# Reusable test-coverage (covr) workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: test-coverage
#   on:
#     push: { branches: [main, development] }
#     pull_request: { branches: [main, development] }
#   jobs:
#     test-coverage:
#       uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@v0.4
#       ## Name the secrets you pass rather than using `secrets: inherit`.
#       ## Both are optional; drop either line if unused.
#       secrets:
#         GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
name: test-coverage

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""
      dependencies:
        description: "R expression for setup-r-dependencies' `dependencies` input. Use NA when transitive Suggests resolution conflicts (then add the needed Suggests directly via extra-packages)."
        type: string
        default: '"all"'
      run-in-tmux:
        description: >-
          Run the covr step inside a detached tmux session. Needed by packages
          whose code branches on Sys.getenv("TMUX") (e.g. SpaDES.project's
          experimentTmux()); without it those paths are unreachable on CI and
          every test gated on being inside tmux silently skips. Off by default,
          so existing callers are unaffected.
        type: boolean
        default: false

    secrets:
      GOOGLEDRIVE_AUTH:
        description: >-
          Google Drive credential, either a service-account key (JSON) or a
          serialized R user OAuth token (saveRDS of a gargle/httr token).
          Base64-encoded is preferred; raw service-account JSON is also
          accepted, but a token MUST be base64 (it is binary). The type is
          detected at staging time. A user OAuth token is preferred: a service
          account has no Drive quota on user-owned folders, so it can
          authenticate but cannot complete an upload round-trip. Optional --
          Drive-backed tests skip without it.
        required: false
      CODECOV_TOKEN:
        description: "Codecov upload token. Optional for public repos."
        required: false

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      USING_COVR: true
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # Stock Noble apt (replicates reproducible). The ubuntugis-unstable PPA
      # used by install-spatial-deps installs libgdal37, which is ABI-incompatible
      # with the binaries in Posit's noble cache and breaks geospatial loads.
      - name: Install spatial deps (Linux, stock Noble)
        # Short acquire timeouts + retries so a stalled GitHub apt mirror
        # (azure.archive.ubuntu.com intermittently goes Ign) aborts in ~30s and
        # fails over instead of hanging the step. See R-CMD-check.yaml for the
        # observed failure.
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -f -y || true
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --fix-missing \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev
        shell: bash

      - name: Install tmux
        if: ${{ inputs.run-in-tmux }}
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tmux
          tmux -V
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://PredictiveEcology.r-universe.dev/'
          Ncpus: 2
          # Match R-CMD-check / pkgdown: RSPM noble binaries are built against
          # stock libgdal34 (matches the apt step); r-universe terra is libgdal37.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ inputs.dependencies }}
          extra-packages: |
            any::covr
            ${{ inputs.extra-packages }}

      - name: Install additional package dependencies
        if: ${{ inputs.post-install != '' }}
        run: ${{ inputs.post-install }}
        shell: Rscript {0}

      # Google Drive service-account credentials. Staged after the install
      # steps and handed only to the "Test coverage" step below, so the
      # credential is never in the environment of a step that installs
      # third-party code. Accepts base64 (preferred) or raw JSON, and warns
      # rather than silently skipping when the secret is set but unusable.
      # See R-CMD-check.yaml for the full rationale.
      - name: Stage Google Drive credentials
        id: gdrive-auth
        shell: bash
        env:
          GOOGLEDRIVE_AUTH_SECRET: ${{ secrets.GOOGLEDRIVE_AUTH }}
          GOOGLEDRIVE_AUTH_PRESENT: ${{ secrets.GOOGLEDRIVE_AUTH != '' }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLEDRIVE_AUTH_SECRET:-}" ]; then
            if [ "${GOOGLEDRIVE_AUTH_PRESENT}" = "true" ]; then
              echo "::warning title=Google Drive auth unavailable::GOOGLEDRIVE_AUTH is configured for this repository but arrived empty. Drive-backed tests will SKIP."
            else
              echo "GOOGLEDRIVE_AUTH not configured; Drive-backed tests will skip."
            fi
            exit 0
          fi
          raw="${RUNNER_TEMP}/gdrive-credential"
          case "$(printf '%s' "${GOOGLEDRIVE_AUTH_SECRET}" | head -c 64 | tr -d '[:space:]')" in
            \{*) printf '%s' "${GOOGLEDRIVE_AUTH_SECRET}" > "$raw" ;;
            *)   printf '%s' "${GOOGLEDRIVE_AUTH_SECRET}" | base64 -d > "$raw" 2>/dev/null || : ;;
          esac
          if [ ! -s "$raw" ]; then
            rm -f "$raw"
            echo "::warning title=Google Drive auth unusable::GOOGLEDRIVE_AUTH did not decode to anything. Drive-backed tests will SKIP."
            exit 0
          fi
          # One secret, two possible credential types -- sniff which arrived and
          # export a TYPED output so the R side never has to guess:
          #   service-account JSON -> GOOGLEDRIVE_AUTH  (drive_auth(path=))
          #   serialized R token   -> GDRIVE_OAUTH_TOKEN (drive_auth(token=))
          # A user OAuth token is preferred: a service account has no Drive quota
          # on user-owned folders, so it authenticates but cannot complete an
          # upload round-trip, which silently leaves those tests uncovered.
          if grep -q '"service_account"' "$raw" 2>/dev/null; then
            f="${RUNNER_TEMP}/google-sa.json"
            mv "$raw" "$f"
            echo "sa-path=$f" >> "$GITHUB_OUTPUT"
            echo "Staged service-account JSON ($(wc -c < "$f") bytes) at $f"
            exit 0
          fi
          # readRDS() accepts gzip (1f8b), bzip2 (425a), xz (fd37) or an
          # uncompressed R serialization header (X/A/B followed by a newline).
          magic="$(head -c 2 "$raw" | od -An -tx1 | tr -d ' \n')"
          case "$magic" in
            1f8b|425a|fd37|58*|41*|42*) ;;
            *)
              rm -f "$raw"
              echo "::warning title=Google Drive auth unusable::GOOGLEDRIVE_AUTH decoded to neither service-account JSON nor a serialized R token. Drive-backed tests will SKIP."
              exit 0
              ;;
          esac
          f="${RUNNER_TEMP}/google-oauth-token.rds"
          mv "$raw" "$f"
          echo "token-path=$f" >> "$GITHUB_OUTPUT"
          echo "Staged Drive user OAuth token ($(wc -c < "$f") bytes) at $f"

      # Report, IN THE WORKFLOW LOG, whether the staged credential actually
      # works and which identity it is.
      #
      # This cannot be left to the test suite. Drive tests skip when auth is
      # unavailable, so a broken credential and an absent one look identical --
      # and under covr it is worse: covr neither fails the build on a test
      # failure nor prints a skip summary, so even a test written to fail loudly
      # is silent here. A service-account key authenticated fine for months while
      # being unable to upload (service accounts have no Drive quota on
      # user-owned folders); the only symptom was a coverage number that quietly
      # stayed flat, and diagnosing it took repeated 25-minute round-trips.
      #
      # Staging already proves the secret decoded. This proves it AUTHENTICATES,
      # by making one real API call -- drive_has_token() is not enough, since it
      # is TRUE for a scope-limited token that 403s on first use and for one
      # whose refresh is broken.
      #
      # Never fails the build: it is a diagnostic, and a repo with no Drive
      # credential is a normal, supported configuration.
      - name: Verify Google Drive credential
        if: steps.gdrive-auth.outputs.token-path != '' || steps.gdrive-auth.outputs.sa-path != ''
        continue-on-error: true
        env:
          GOOGLEDRIVE_AUTH: ${{ steps.gdrive-auth.outputs.sa-path }}
          GDRIVE_OAUTH_TOKEN: ${{ steps.gdrive-auth.outputs.token-path }}
        run: |
          Rscript -e '
            if (!requireNamespace("googledrive", quietly = TRUE)) {
              cat("googledrive not installed; skipping credential verification\n"); quit(save = "no")
            }
            tp <- Sys.getenv("GDRIVE_OAUTH_TOKEN"); sp <- Sys.getenv("GOOGLEDRIVE_AUTH")
            kind <- if (nzchar(tp)) "user OAuth token" else "service account"
            cat("credential type:", kind, "\n")
            ok <- tryCatch({
              if (nzchar(tp)) {
                tok <- readRDS(tp)
                # A gargle token carries the cache_path it was MINTED with (e.g.
                # ~/.secret). drive_auth() writes the refreshed token back there;
                # on a runner that directory does not exist, the write fails, and
                # gargle reports it as "Cant get Google credentials" -- identical
                # to having no credential at all. Match what the package test
                # helpers do, so this step reports the credential and not that.
                tok$cache_path <- NULL
                googledrive::drive_auth(token = tok)
              } else            googledrive::drive_auth(path = sp)
              TRUE
            }, error = function(e) { cat("AUTH FAILED:", conditionMessage(e), "\n"); FALSE })
            if (!ok) quit(save = "no")
            who <- tryCatch(googledrive::drive_user()$emailAddress,
                            error = function(e) paste("ERROR:", conditionMessage(e)))
            cat("identity:", who, "\n")
            if (startsWith(who, "ERROR:")) {
              cat("::warning title=Drive credential unusable::Authenticated, but the first API call failed. Drive-backed tests will produce no coverage.\n")
            } else if (grepl("gserviceaccount", who)) {
              cat("::warning title=Drive credential is a service account::Service accounts have no Drive quota on user-owned folders, so upload/round-trip tests cannot pass and the cloud code paths will report zero coverage.\n")
            }
          '

      - name: Test coverage
        env:
          # Exactly one of these is non-empty, depending on which credential
          # type GOOGLEDRIVE_AUTH held. Both empty -> the R side skips, as it
          # does locally.
          GOOGLEDRIVE_AUTH: ${{ steps.gdrive-auth.outputs.sa-path }}
          GDRIVE_OAUTH_TOKEN: ${{ steps.gdrive-auth.outputs.token-path }}
          # Ceiling for the tmux-wrapped run; baseline is ~15 min.
          TMUX_COVR_TIMEOUT: "3600"
        # Wraps covr::merge_coverage.character to skip unreadable per-test trace
        # files (zero-byte or truncated RDS) instead of aborting with the cryptic
        # `Error in readRDS(f) : error reading from connection`. Root cause: a
        # test that spawns a subprocess (e.g. callr::r_bg) sometimes leaves a
        # child alive that the session can't terminate ("Error while shutting
        # down parallel: unable to terminate some child processes"); that
        # orphan's covr trace file is created but never flushed. Skipping it
        # loses only the orphan's coverage and lets the rest report normally.
        # The skip is logged with the file path and size so a real corruption
        # (vs. a benign orphan) is still visible.
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/test-coverage.R" <<'RSCRIPT'
          ns <- asNamespace("covr")
          orig <- get("merge_coverage.character", envir = ns, inherits = FALSE)
          wrapped <- function(x, ...) {
            readable <- vapply(x, function(f) {
              if (!file.exists(f) || !isTRUE(file.size(f) > 0)) return(FALSE)
              isTRUE(tryCatch({ readRDS(f); TRUE }, error = function(e) FALSE))
            }, logical(1))
            skipped <- x[!readable]
            if (length(skipped)) {
              message("test-coverage: skipping ", length(skipped),
                      " unreadable covr trace file(s) (likely from a child ",
                      "process that didn't flush; see workflow comment):")
              for (f in skipped) {
                sz <- if (file.exists(f)) file.size(f) else NA_integer_
                message(sprintf("  [%s bytes] %s", format(sz), f))
              }
            }
            orig(x[readable], ...)
          }
          unlockBinding("merge_coverage.character", ns)
          assign("merge_coverage.character", wrapped, envir = ns)
          lockBinding("merge_coverage.character", ns)

          covr::codecov(quiet = FALSE)
          RSCRIPT

          if [ "${{ inputs.run-in-tmux }}" = "true" ]; then
            # `tmux new-session -d <cmd>` runs the command in a pane, so the R
            # process inherits TMUX and code branching on it becomes reachable.
            rc_file="${RUNNER_TEMP}/covr.rc"
            log_file="${RUNNER_TEMP}/covr.log"
            rm -f "$rc_file"

            tmux new-session -d -s covr \
              "Rscript '${RUNNER_TEMP}/test-coverage.R' > '$log_file' 2>&1; echo \$? > '$rc_file'"

            # Wait for R to RECORD ITS EXIT STATUS, not for the tmux session to
            # disappear. Those are not the same event: a test that leaves an
            # orphaned child (covr suites do this routinely -- see the
            # merge_coverage wrapper above, and "Error while shutting down
            # parallel: unable to terminate some child processes") keeps the pane
            # alive after R is gone, so `tmux has-session` never goes false and
            # the step hangs until the job timeout. Observed once as a 2h11m
            # "Test coverage" step against a ~15 min baseline.
            deadline=$(( SECONDS + TMUX_COVR_TIMEOUT ))
            while [ ! -f "$rc_file" ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error title=Coverage timed out::No exit status after ${TMUX_COVR_TIMEOUT}s."
                tmux kill-session -t covr 2>/dev/null || true
                [ -f "$log_file" ] && cat "$log_file"
                exit 1
              fi
              sleep 5
            done

            # R is done; the pane may still be held open by an orphan.
            tmux kill-session -t covr 2>/dev/null || true
            cat "$log_file"
            exit "$(cat "$rc_file")"
          else
            Rscript "${RUNNER_TEMP}/test-coverage.R"
          fi
