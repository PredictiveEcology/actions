## Reusable workflow: run a SpaDES module's testthat suite.
##
## Callers keep only their triggers and the module name:
##
##   name: testthat-module
##   on:
##     push: { branches: [main, master, development] }
##     pull_request: { branches: [main, master, development] }
##   jobs:
##     testthat-module:
##       uses: PredictiveEcology/actions/.github/workflows/testthat-module.yaml@main
##       with:
##         module: myModule
##       ## Only if the tests read from Google Drive. Name the secret you pass;
##       ## the caller's own secret may have any name.
##       secrets:
##         GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
##
## This is `render-module-rmd.yaml` with the render and commit jobs replaced by a
## test run; everything above them -- spatial system deps, the apt retry wrapper,
## install-Require, install-SpaDES, and dependency resolution straight from module
## metadata -- is deliberately identical, so a fix to one is a fix to both.
##
## There is NO commit job here, and that omission is deliberate: `convertToPackage()`
## rewrites a module and is not reversible, so nothing this workflow produces may be
## pushed back to the repository.
##
## Assumes the module name equals the repository name, as `render-module-rmd.yaml`
## does.

name: testthat-module

on:
  workflow_call:
    inputs:
      depends-on-virtual-bump:
        description: >-
          Opt in. For each open `Depends-on: owner/repo#N` PR, resolve the dependencies
          against a copy of that PR with its Version raised by one (the post-merge
          bump), so a floor written as the post-merge version is met. Default false:
          the PR is installed after the dependency solve, as before.
        type: boolean
        default: false
      depends-on-gate:
        description: >-
          Opt in. Skip the jobs while an upstream `Depends-on:` PR has pending or failed
          checks; they run once it is green or merged (see depends-on-rerun.yaml for the
          automatic re-run). Default false.
        type: boolean
        default: false
      module:
        description: >-
          Module name, i.e. the basename of <module>.R. Must match the repository
          name, unless `module-dir` is given.
        required: true
        type: string
      module-dir:
        description: >-
          Folder holding the module, relative to the repository root, for a
          repository with several modules (e.g. `modules/scfmSpread`); its last
          part must be the module name. Empty (the default): the repository root,
          which must then be named after the module.
        required: false
        type: string
        default: ""
      r-version:
        description: "R version passed to setup-r."
        required: false
        type: string
        default: "release"
      system-deps:
        description: >-
          Install the geospatial system libraries (GDAL/GEOS/PROJ/udunits).
          Nearly every module needs them; set false for one that does not.
        required: false
        type: boolean
        default: true
      extra-apt:
        description: >-
          Additional apt packages, space-separated. Modules have no DESCRIPTION, so
          nothing can derive their system requirements automatically.
        required: false
        type: string
        default: ""
      coverage:
        description: >-
          Write a coverage summary to the job summary. Coverage is reported here
          rather than uploaded because module repositories have no codecov.yml and
          most modules have too few tests for a tracked number to mean anything
          yet. The org-level CODECOV_TOKEN does reach module repositories; see
          PredictiveEcology/SpaDES.core#441.
        required: false
        type: boolean
        default: true
    secrets:
      GOOGLEDRIVE_AUTH:
        description: >-
          Google Drive credential: a base64-encoded serialized R user OAuth
          token (saveRDS of a gargle/httr token), or a service-account key as
          base64 or raw JSON. A service account cannot upload into a folder in
          a person's My Drive (it has no storage quota); it can read, and can
          upload to a Shared Drive. Optional -- without it the tests get no
          Drive credential. The tests receive its PATH, never the secret: a
          token in GDRIVE_OAUTH_TOKEN (drive_auth(token = readRDS(.))) or a
          key in GOOGLEDRIVE_AUTH (drive_auth(path = .)).
        required: false

## See render-module-rmd.yaml (#33): inside a called workflow `github.workflow`
## resolves to the CALLER's name, so without the `-reusable` suffix this key can
## collide with a caller that declares its own concurrency, and GitHub cancels the
## run before any job starts.
## Named after this workflow and the module: `github.workflow` is the caller, and a
## caller running both workflows for several modules (examples/multi-module.caller.yaml)
## would otherwise put each module's test and render in one group and cancel one.
concurrency:
  group: ${{ github.workflow }}-testthat-module-${{ github.ref }}-${{ inputs.module }}-reusable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ## Opt-in (`depends-on-gate`): holds the other jobs back while an upstream
  ## `Depends-on:` PR is pending or failed. Skipped by default. See
  ## install-depends-on/README.md.
  depends-on-gate:
    if: ${{ inputs.depends-on-gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      config: ${{ steps.gate.outputs.config }}
    steps:
      - id: gate
        uses: PredictiveEcology/actions/install-depends-on@main
        with:
          mode: gate
          hold: ${{ inputs.depends-on-gate }}

  testthat-module:
    needs: depends-on-gate
    ## A skipped gate (the default) lets the job run exactly as before.
    if: ${{ !cancelled() && needs.depends-on-gate.result != 'failure' && (needs.depends-on-gate.result == 'skipped' || needs.depends-on-gate.outputs.ready == 'true') }}
    name: Test module
    runs-on: ubuntu-latest
    ## Without a cap a hung dependency install runs to GitHub's 6 h default and holds this
    ## module's concurrency group; successful runs take a median 7-9 min, at most 39 (2026-10).
    timeout-minutes: 60
    permissions:
      contents: read
    ## Every GitHub install here -- Require itself, then each `owner/repo@ref` in the
    ## module's reqdPkgs -- calls the GitHub API. Unauthenticated they fall back to
    ## the bundled PAT and fail on its rate limit. GITHUB_TOKEN is available to a
    ## called workflow without `secrets: inherit`.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MODULE: ${{ inputs.module }}
      MODULE_DIR: ${{ inputs.module-dir }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: ${{ inputs.system-deps }}
        uses: PredictiveEcology/actions/install-spatial-deps@main

      ## Same retry wrapper install-spatial-deps uses: a composite-action step cannot
      ## use `timeout-minutes`, so a stalled mirror otherwise burns the 6h job ceiling.
      - name: Install other system dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          EXTRA_APT: ${{ inputs.extra-apt }}
        run: |
          set -euo pipefail
          retry() {
            local n
            for n in 1 2 3; do
              ## A timeout while dpkg is unpacking leaves it "interrupted", and every later
              ## apt-get then fails at once until this runs; it does nothing otherwise.
              sudo dpkg --configure -a || true
              if timeout --kill-after=60s "$1" bash -c "$2"; then return 0; fi
              echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
              sleep $((n * 15))
            done
            echo "::error::'$2' still failing after 3 attempts"
            return 1
          }
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          retry 5m  "sudo -E apt-get update -y"
          install_cmd="sudo -E NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
                       libcurl4-openssl-dev libgit2-dev libglpk-dev libmagick++-dev \
                       libxml2-dev python3-gdal ${EXTRA_APT}"
          ## Download first: killing a download is harmless and the next attempt keeps it.
          retry 10m "$install_cmd --download-only"
          retry 10m "$install_cmd"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          use-public-rspm: true
          Ncpus: 2

      ## Order matters: install-SpaDES opens with `Require::setLinuxBinaryRepo()`,
      ## so Require has to exist first.
      - uses: PredictiveEcology/actions/install-Require@main

      - uses: PredictiveEcology/actions/install-SpaDES@main


      ## The test toolchain is only in SpaDES.core's Suggests, so install-SpaDES does
      ## not bring it in. This is the counterpart of render-module-rmd's
      ## install-Rmd-pkgs step. Without it the first run died before any test, in
      ## convertToPackage(): `requireNamespace("pkgload", quietly = TRUE) is not TRUE`.
      ##   pkgload, roxygen2 -- convertToPackage()
      ##   testthat          -- test_local()
      ##   covr              -- moduleCoverage()
      ##   withr             -- the tests/testthat/setup.R template
      - name: Install test packages
        shell: Rscript {0}
        run: |
          Require::Require(c("covr", "pkgload", "roxygen2", "testthat", "withr"),
                           require = FALSE)

      ## `mp` is ".." by default, and that is not a typo: actions/checkout puts the
      ## repository at /home/runner/work/<repo>/<repo>, so the working directory is
      ## itself named after the module and its parent is the module *directory*
      ## SpaDES.core expects. With `module-dir` it is that folder's parent. Index `packages()` once -- indexing twice reduces the whole
      ## dependency vector to the string "SpaDES.core".
      ## Opt-in (`depends-on-virtual-bump`): before the module's reqdPkgs resolve, so
      ## a floor written as the post-merge version of a `Depends-on:` PR is met.
      - if: ${{ inputs.depends-on-virtual-bump }}
        uses: PredictiveEcology/actions/install-depends-on@main
        with:
          mode: prepare
          preinstall: true

      - name: Install module package dependencies
        shell: Rscript {0}
        run: |
          m <- Sys.getenv("MODULE")
          md <- Sys.getenv("MODULE_DIR"); mp <- if (nzchar(md)) dirname(md) else ".."
          pkgs <- SpaDES.core::packages(modules = m, paths = mp)
          Require::Require(pkgs[[1]])

      ## After the dependency install on purpose, so a `Depends-on:` PR overrides it.
      - uses: PredictiveEcology/actions/install-depends-on@main

      ## A module with no tests must not fail: at the time this workflow was written
      ## almost every module carried only the dead `newModule()` scaffolding, so a
      ## hard failure would paint the whole family red for the absence of tests
      ## rather than for a defect.
      - name: Check for tests
        id: has_tests
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "${MODULE_DIR:-.}/tests/testthat/test*.R" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test files under tests/testthat/; nothing to run."
            echo "### No tests" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${MODULE}\` has no files matching \`${MODULE_DIR:-.}/tests/testthat/test*.R\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      ## Build the package rendition in a throwaway directory and test that. A module
      ## keeps its functions inline in <module>.R, so without this they are only ever
      ## parsed into a simList and a test cannot call one directly; converting puts
      ## them in a real namespace. `destinationPath` keeps the module itself untouched
      ## -- the conversion is not reversible.
      ## Staged here, after every install step: those run third-party code and none
      ## of it needs this credential. Only the two steps that run tests receive it.
      - name: Stage Google Drive credentials
        id: gdrive-auth
        if: ${{ steps.has_tests.outputs.found == 'true' }}
        uses: PredictiveEcology/actions/stage-gdrive-auth@main
        with:
          credential: ${{ secrets.GOOGLEDRIVE_AUTH }}
          present: ${{ secrets.GOOGLEDRIVE_AUTH != '' }}

      ## Log in to Drive automatically, so module tests need no auth code. Both
      ## test runs below (test_local() here, and covr's separate --vanilla R
      ## process in moduleCoverage()) copy tests/testthat/ and source every
      ## helper-*.R in it first, so a helper file is the one place that reaches
      ## both. It goes into this throwaway checkout only; nothing is committed.
      ## A credential that was staged but does not work stops the test run.
      - name: Add Google Drive login helper
        if: ${{ steps.gdrive-auth.outputs.token-path != '' || steps.gdrive-auth.outputs.sa-path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          f="${MODULE_DIR:-.}/tests/testthat/helper-000-ci-gdrive-login.R"
          if [ -e "$f" ]; then echo "::error::$f already exists"; exit 1; fi
          cat > "$f" <<'RHELPER'
          ## Written by PredictiveEcology/actions testthat-module.yaml; not in the repository.
          local({
            sa <- Sys.getenv("GOOGLEDRIVE_AUTH"); tp <- Sys.getenv("GDRIVE_OAUTH_TOKEN")
            if (!nzchar(sa) && !nzchar(tp)) return(invisible())
            Require::Require("googledrive")
            if (googledrive::drive_has_token()) return(invisible())
            if (nzchar(sa)) {
              googledrive::drive_auth(path = sa)
            } else {
              tok <- readRDS(tp)
              ## drive_auth() writes a refreshed token back to the token's
              ## cache_path, the folder it was minted in; on a runner that fails
              ## and is reported as "Can't get Google credentials".
              tok$cache_path <- NULL
              googledrive::drive_auth(token = tok)
            }
            message("Google Drive: logged in as ", googledrive::drive_user()$emailAddress)
          })
          RHELPER
          echo "Added $f"

      - name: Run tests
        if: ${{ steps.has_tests.outputs.found == 'true' }}
        shell: Rscript {0}
        env:
          # At most one is non-empty, depending on which credential type the
          # secret held. Both empty -> no credential, as locally.
          GDRIVE_OAUTH_TOKEN: ${{ steps.gdrive-auth.outputs.token-path }}
          GOOGLEDRIVE_AUTH: ${{ steps.gdrive-auth.outputs.sa-path }}
        run: |
          m <- Sys.getenv("MODULE")
          md <- Sys.getenv("MODULE_DIR"); mp <- if (nzchar(md)) dirname(md) else ".."
          pkg <- SpaDES.core::convertToPackage(m, path = mp, buildDocuments = TRUE,
                                               destinationPath = tempfile("testthat-module"))
          ## With `module-dir`, link the other modules of that folder beside the converted
          ## one, as they sit in the repository, so a test can run this module with its
          ## neighbours (scfmSpread's tests run scfmEscape too).
          if (nzchar(md)) {
            for (s in setdiff(list.dirs(mp, recursive = FALSE), md))
              file.symlink(normalizePath(s), file.path(dirname(pkg), basename(s)))
          }
          res <- testthat::test_local(pkg, reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          bad <- sum(df$failed) + sum(df$error)
          if (bad > 0) stop(bad, " test failure(s) in ", m)

      ## The number goes in the job summary rather than to Codecov: module
      ## repositories have no codecov.yml, and most modules have too few tests for a
      ## tracked number to mean anything yet. That is a choice, not a missing
      ## credential -- the org-level CODECOV_TOKEN reaches module repositories, so
      ## uploading later needs only the secret declared here and an upload step like
      ## test-coverage.yaml's. moduleCoverage() reports against <module>.R, not the
      ## generated R/ copy.
      - name: Coverage summary
        if: ${{ inputs.coverage && steps.has_tests.outputs.found == 'true' }}
        shell: Rscript {0}
        ## moduleCoverage() runs the tests again, so it needs the same credential.
        env:
          GDRIVE_OAUTH_TOKEN: ${{ steps.gdrive-auth.outputs.token-path }}
          GOOGLEDRIVE_AUTH: ${{ steps.gdrive-auth.outputs.sa-path }}
        run: |
          m <- Sys.getenv("MODULE")
          md <- Sys.getenv("MODULE_DIR"); mp <- if (nzchar(md)) dirname(md) else ".."
          cov <- try(SpaDES.core::moduleCoverage(m, modulePath = mp), silent = TRUE)
          out <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (inherits(cov, "try-error")) {
            cat("### Coverage\n\nCould not be measured:\n\n```\n",
                as.character(cov), "```\n", sep = "", file = out, append = TRUE)
          } else {
            df <- as.data.frame(cov)
            per <- tapply(df$value, df$filename, function(x) round(100 * mean(x > 0), 1))
            cat("### Coverage\n\n**", round(covr::percent_coverage(cov), 1), "%** overall\n\n",
                "| file | coverage |\n|---|---|\n",
                paste0("| `", names(per), "` | ", per, "% |", collapse = "\n"),
                "\n", sep = "", file = out, append = TRUE)
          }
