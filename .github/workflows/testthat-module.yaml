## Reusable workflow: run a SpaDES module's testthat suite.
##
## Callers keep only their triggers and the module name:
##
##   name: testthat-module
##   on:
##     push: { branches: [main, master, development] }
##     pull_request: { branches: [main, master, development] }
##   jobs:
##     testthat-module:
##       uses: PredictiveEcology/actions/.github/workflows/testthat-module.yaml@main
##       with:
##         module: myModule
##
## This is `render-module-rmd.yaml` with the render and commit jobs replaced by a
## test run; everything above them -- spatial system deps, the apt retry wrapper,
## install-Require, install-SpaDES, and dependency resolution straight from module
## metadata -- is deliberately identical, so a fix to one is a fix to both.
##
## There is NO commit job here, and that omission is deliberate: `convertToPackage()`
## rewrites a module and is not reversible, so nothing this workflow produces may be
## pushed back to the repository.
##
## Assumes the module name equals the repository name, as `render-module-rmd.yaml`
## does.

name: testthat-module

on:
  workflow_call:
    inputs:
      module:
        description: >-
          Module name, i.e. the basename of <module>.R. Must match the repository name.
        required: true
        type: string
      r-version:
        description: "R version passed to setup-r."
        required: false
        type: string
        default: "release"
      system-deps:
        description: >-
          Install the geospatial system libraries (GDAL/GEOS/PROJ/udunits).
          Nearly every module needs them; set false for one that does not.
        required: false
        type: boolean
        default: true
      extra-apt:
        description: >-
          Additional apt packages, space-separated. Modules have no DESCRIPTION, so
          nothing can derive their system requirements automatically.
        required: false
        type: string
        default: ""
      coverage:
        description: >-
          Write a coverage summary to the job summary. Module repositories have no
          CODECOV_TOKEN and no codecov.yml, so coverage is reported here rather than
          uploaded; see PredictiveEcology/SpaDES.core#441.
        required: false
        type: boolean
        default: true

## See render-module-rmd.yaml (#33): inside a called workflow `github.workflow`
## resolves to the CALLER's name, so without the `-reusable` suffix this key can
## collide with a caller that declares its own concurrency, and GitHub cancels the
## run before any job starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-reusable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  testthat-module:
    ## `head_commit` is the tip of the push, matching GitHub's own semantics. The
    ## generated workflows this pattern replaces tested `commits[0]` -- the OLDEST
    ## commit -- so `[skip-ci]` on the tip was ignored (#34).
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    name: Test module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    ## Every GitHub install here -- Require itself, then each `owner/repo@ref` in the
    ## module's reqdPkgs -- calls the GitHub API. Unauthenticated they fall back to
    ## the bundled PAT and fail on its rate limit. GITHUB_TOKEN is available to a
    ## called workflow without `secrets: inherit`.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MODULE: ${{ inputs.module }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: ${{ inputs.system-deps }}
        uses: PredictiveEcology/actions/install-spatial-deps@main

      ## Same retry wrapper install-spatial-deps uses: a composite-action step cannot
      ## use `timeout-minutes`, so a stalled mirror otherwise burns the 6h job ceiling.
      - name: Install other system dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          EXTRA_APT: ${{ inputs.extra-apt }}
        run: |
          set -euo pipefail
          retry() {
            local n
            for n in 1 2 3; do
              if timeout --kill-after=60s "$1" bash -c "$2"; then return 0; fi
              echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
              sleep $((n * 15))
            done
            echo "::error::'$2' still failing after 3 attempts"
            return 1
          }
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          retry 5m  "sudo -E apt-get update -y"
          retry 10m "sudo -E NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
                       libcurl4-openssl-dev libgit2-dev libglpk-dev libmagick++-dev \
                       libxml2-dev python3-gdal ${EXTRA_APT}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          use-public-rspm: true
          Ncpus: 2

      ## Order matters: install-SpaDES opens with `Require::setLinuxBinaryRepo()`,
      ## so Require has to exist first.
      - uses: PredictiveEcology/actions/install-Require@main

      - uses: PredictiveEcology/actions/install-SpaDES@main

      ## TEMPORARY. install-SpaDES installs the released SpaDES.core, which does not
      ## have `convertToPackage(destinationPath =)` or the `moduleCoverage()` this
      ## workflow relies on (PredictiveEcology/SpaDES.core#440, #441). Drop this step
      ## once a SpaDES.core carrying both is released.
      - name: Install SpaDES.core (development)
        shell: Rscript {0}
        run: |
          Require::Require("PredictiveEcology/SpaDES.core@development",
                           require = FALSE, upgrade = FALSE)

      ## The test toolchain is only in SpaDES.core's Suggests, so install-SpaDES does
      ## not bring it in. This is the counterpart of render-module-rmd's
      ## install-Rmd-pkgs step. Without it the first run died before any test, in
      ## convertToPackage(): `requireNamespace("pkgload", quietly = TRUE) is not TRUE`.
      ##   pkgload, roxygen2 -- convertToPackage()
      ##   testthat          -- test_local()
      ##   covr              -- moduleCoverage()
      ##   withr             -- the tests/testthat/setup.R template
      - name: Install test packages
        shell: Rscript {0}
        run: |
          Require::Require(c("covr", "pkgload", "roxygen2", "testthat", "withr"),
                           require = FALSE)

      ## `paths = ".."` is not a typo: actions/checkout puts the repository at
      ## /home/runner/work/<repo>/<repo>, so the working directory is itself named
      ## after the module and its parent is the module *directory* SpaDES.core
      ## expects. Index `packages()` once -- indexing twice reduces the whole
      ## dependency vector to the string "SpaDES.core".
      - name: Install module package dependencies
        shell: Rscript {0}
        run: |
          m <- Sys.getenv("MODULE")
          pkgs <- SpaDES.core::packages(modules = m, paths = "..")
          Require::Require(pkgs[[1]])

      ## A module with no tests must not fail: at the time this workflow was written
      ## almost every module carried only the dead `newModule()` scaffolding, so a
      ## hard failure would paint the whole family red for the absence of tests
      ## rather than for a defect.
      - name: Check for tests
        id: has_tests
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "tests/testthat/test*.R" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test files under tests/testthat/; nothing to run."
            echo "### No tests" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${MODULE}\` has no files matching \`tests/testthat/test*.R\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      ## Build the package rendition in a throwaway directory and test that. A module
      ## keeps its functions inline in <module>.R, so without this they are only ever
      ## parsed into a simList and a test cannot call one directly; converting puts
      ## them in a real namespace. `destinationPath` keeps the module itself untouched
      ## -- the conversion is not reversible.
      - name: Run tests
        if: ${{ steps.has_tests.outputs.found == 'true' }}
        shell: Rscript {0}
        run: |
          m <- Sys.getenv("MODULE")
          pkg <- SpaDES.core::convertToPackage(m, path = "..", buildDocuments = TRUE,
                                               destinationPath = tempfile("testthat-module"))
          res <- testthat::test_local(pkg, reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          bad <- sum(df$failed) + sum(df$error)
          if (bad > 0) stop(bad, " test failure(s) in ", m)

      ## Module repositories have no CODECOV_TOKEN and no codecov.yml, so the number
      ## goes in the job summary rather than to a coverage service. moduleCoverage()
      ## reports against <module>.R, not the generated R/ copy.
      - name: Coverage summary
        if: ${{ inputs.coverage && steps.has_tests.outputs.found == 'true' }}
        shell: Rscript {0}
        run: |
          m <- Sys.getenv("MODULE")
          cov <- try(SpaDES.core::moduleCoverage(m, modulePath = ".."), silent = TRUE)
          out <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (inherits(cov, "try-error")) {
            cat("### Coverage\n\nCould not be measured:\n\n```\n",
                as.character(cov), "```\n", sep = "", file = out, append = TRUE)
          } else {
            df <- as.data.frame(cov)
            per <- tapply(df$value, df$filename, function(x) round(100 * mean(x > 0), 1))
            cat("### Coverage\n\n**", round(covr::percent_coverage(cov), 1), "%** overall\n\n",
                "| file | coverage |\n|---|---|\n",
                paste0("| `", names(per), "` | ", per, "% |", collapse = "\n"),
                "\n", sep = "", file = out, append = TRUE)
          }
