## Self-test for this repository's own composite actions.
##
## Why this exists: the four reusable workflows here are `workflow_call:`-only,
## so nothing in this repository runs on a pull request. A change merges to
## `main` unverified and reaches every consumer pinned at `@main` on their next
## run -- today that is SpaDES, reproducible, SpaDES.core (workflows) and
## NetLogoR (install-spatial-deps). This is the gate that makes `@main` a safe
## default pin instead of a gamble.
##
## The actions are referenced by LOCAL path (`./setup-r-deps`), which resolves
## to the pull request's checkout rather than to `main`. That is the whole
## trick: it tests the code under review, so a new action can be verified
## BEFORE it exists on `main`, and `uses:`-cannot-take-an-expression never
## comes up.
##
## Scope limit, stated plainly: this covers the composite actions only. The
## reusable workflows cannot be self-tested as they stand, because they check
## out the caller at its root and run `R CMD check` there, and this repository
## has no DESCRIPTION at its root. Closing that gap needs a `working-directory`
## input threaded through the workflows -- worth doing, deliberately not done
## here.

name: self-test

on:
  pull_request:
    branches: [main]
    paths:
      - "setup-r-deps/**"
      - "stage-gdrive-auth/**"
      - "install-spatial-deps/**"
      - "install-Require/**"
      - "install-Rmd-pkgs/**"
      - "install-SpaDES/**"
      - "tests/fixture/**"
      - ".github/workflows/self-test.yaml"
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-r-deps:
    name: setup-r-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./setup-r-deps
        with:
          working-directory: tests/fixture
          ## Distinct from the consumers' cache namespace, so a poisoned
          ## self-test cache can never be handed to a real package's build.
          cache-version: self-test-1
          extra-packages: any::sessioninfo

      ## `gdal-config --version` inside the action proves the HEADERS are
      ## present. Only a load proves the ABI matches -- and an ABI mismatch is
      ## exactly the failure the ubuntugis PPA removal is about, surfacing as
      ## `libgdal.so.34: cannot open shared object file` at lazy-load time.
      - name: Verify the spatial stack loads and reprojects
        shell: Rscript {0}
        run: |
          library(terra)
          cat("terra ", as.character(packageVersion("terra")), "\n")
          cat("GDAL  ", terra::gdal(), "\n")
          cat("PROJ  ", terra::gdal(lib = "proj"), "\n")
          cat("GEOS  ", terra::gdal(lib = "geos"), "\n")
          ## Reprojection reads proj.db. This is what the macOS PROJ_DATA step
          ## in setup-r-deps exists to make work; without it this errors with
          ## "Cannot find proj.db (GDAL error 1)".
          p <- terra::project(
            local({
              r <- terra::rast(nrows = 4, ncols = 4, xmin = 0, xmax = 1,
                               ymin = 0, ymax = 1, crs = "EPSG:4326")
              terra::values(r) <- seq_len(16)
              r
            }),
            "EPSG:3857"
          )
          stopifnot(terra::ncell(p) > 0, nzchar(terra::crs(p)))
          cat("reprojection OK\n")

      - name: Session info
        if: always()
        shell: Rscript {0}
        run: sessioninfo::session_info()

  ## Pure logic, no secret required: every branch of the credential sniffing is
  ## reachable with shape-only fixtures. This is the half that silently rots,
  ## because in a real run a broken branch just SKIPS the Drive-backed tests and
  ## the job still goes green.
  stage-gdrive-auth:
    name: stage-gdrive-auth (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - {name: "absent",         kind: "none",  present: "false", expect: "neither"}
          - {name: "dropped secret", kind: "none",  present: "true",  expect: "neither"}
          - {name: "R token (b64)",  kind: "token", present: "true",  expect: "token"}
          - {name: "undecodable",    kind: "junk",  present: "true",  expect: "neither"}
          ## A service-account key must be REFUSED, loudly. This case asserts
          ## the action fails the step rather than staging it or skipping --
          ## the regression it guards is a silent downgrade back to "green but
          ## uploads nothing".
          - {name: "service account", kind: "sa",   present: "true",  expect: "rejected"}
    steps:
      - uses: actions/checkout@v7

      ## None of these are credentials. The service-account fixture carries no
      ## key material -- the action only greps for the `"service_account"`
      ## marker -- and the token fixture is a gzip stream, which is what
      ## saveRDS() emits by default and all the action sniffs for.
      - name: Build shape-only fixtures
        id: fx
        shell: bash
        run: |
          set -euo pipefail
          sa='{"type":"service_account","project_id":"fixture-no-key-material"}'
          case "${{ matrix.case.kind }}" in
            none)  value="" ;;
            sa)    value="$(printf '%s' "$sa" | base64 -w0)" ;;
            token) value="$(printf 'fixture' | gzip -c | base64 -w0)" ;;
            junk)  value="$(printf 'not a credential at all' | base64 -w0)" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: stage
        ## A rejected service account fails the step by design, so this must not
        ## abort the job before the assertion below can check that it did.
        continue-on-error: true
        uses: ./stage-gdrive-auth
        with:
          credential: ${{ steps.fx.outputs.value }}
          present: ${{ matrix.case.present }}

      - name: Assert the right output was set
        shell: bash
        env:
          TOKEN: ${{ steps.stage.outputs.token-path }}
          OUTCOME: ${{ steps.stage.outcome }}
          EXPECT: ${{ matrix.case.expect }}
        run: |
          set -euo pipefail
          got="neither"
          [ -n "${TOKEN:-}" ]        && got="token"
          [ "$OUTCOME" = "failure" ] && got="rejected"
          echo "expected=$EXPECT got=$got  (outcome=$OUTCOME token='${TOKEN:-}')"
          if [ "$got" != "$EXPECT" ]; then
            echo "::error::stage-gdrive-auth returned '$got', expected '$EXPECT'"
            exit 1
          fi
          ## A claimed path must actually exist and be non-empty; an output
          ## pointing at nothing would let the R side fail far from the cause.
          if [ "$got" = "token" ] && [ ! -s "$TOKEN" ]; then
            echo "::error::token-path was set but points at nothing"; exit 1
          fi
          echo "OK"

  ## install-spatial-deps has its own consumers (NetLogoR at @main; LandR, map
  ## and SpaDES.shiny on old tags), so it needs covering independently of
  ## setup-r-deps.
  ##
  ## Linux only, deliberately. setup-r-deps now delegates its spatial setup to
  ## this action, so the setup-r-deps (macOS) leg already exercises this action's
  ## macOS branch -- there is one implementation, not two that happen to match.
  ## A second macOS leg would re-run a ~3GB brew install (llvm, gcc, boost,
  ## aws-sdk-cpp, ~200s) at the 10x macOS billing rate to prove the same thing.
  ##
  ## Caveat: because setup-r-deps references this action at @main, the
  ## setup-r-deps legs test main's copy, not the branch's. Changes to this
  ## action are covered by THIS job, which uses the local path.
  install-spatial-deps:
    name: install-spatial-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./install-spatial-deps
      - name: Report what landed
        shell: bash
        run: |
          gdal-config --version
          geos-config --version
          ## NOT `proj --version`: the proj CLI lives in proj-bin, which
          ## libproj-dev does not pull in, and it is absent on the macOS runner
          ## too. The .pc file ships with the -dev package on both.
          pkg-config --modversion proj

  ## The three legacy `install-*` actions sat in this workflow's `paths:`
  ## filter with no job behind them: editing one fired self-test, self-test ran
  ## setup-r-deps / stage-gdrive-auth / install-spatial-deps instead, and the
  ## green check meant "not tested". These three jobs close that gap.
  ##
  ## Linux only, deliberately. `Require::setLinuxBinaryRepo()` -- the first
  ## statement of two of the three actions -- is a no-op off Ubuntu/Debian
  ## (`isUbuntuOrDebian()`), and every consumer of these actions in the org
  ## runs `ubuntu-latest`.
  ##
  ## `GITHUB_PAT` is set per job because all three install from GitHub via
  ## remotes/Require: unauthenticated api.github.com calls are rate-limited per
  ## IP and runner IPs are shared. The workflow-level `permissions: contents:
  ## read` keeps the token read-only.
  install-Require:
    name: install-Require
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      ## No `with:` -- this leg exercises the DEFAULT GitTag, which is the half
      ## that rotted unnoticed. It was `master`, and PredictiveEcology/Require
      ## has no `master` branch and no `master` tag (`git ls-remote` lists
      ## neither), so the documented default resolved to a hard
      ## `install_github` failure for anyone who took it at its word.
      - uses: ./install-Require

      - name: Assert the default GitTag resolved to development
        shell: Rscript {0}
        run: |
          for (p in c("remotes", "Require")) {
            if (!nzchar(system.file(package = p))) stop(p, " was not installed")
            cat(p, as.character(packageVersion(p)), "\n")
          }
          ## remotes stamps the ref it resolved into the installed DESCRIPTION,
          ## so this asserts WHICH Require landed, not merely that some did.
          ref <- packageDescription("Require")$RemoteRef
          cat("RemoteRef:", ref, "\n")
          if (!identical(ref, "development")) {
            stop("the default GitTag installed '", ref, "', expected 'development'")
          }
          ## install-Rmd-pkgs and install-SpaDES both open with this call, so
          ## its removal from Require would break those two actions and not
          ## this one. Catch it here, where the message is legible.
          if (!is.function(Require::setLinuxBinaryRepo)) {
            stop("Require no longer exports setLinuxBinaryRepo()")
          }

      ## ...and this leg proves the input is honoured rather than ignored.
      - uses: ./install-Require
        with:
          GitTag: main

      - name: Assert an explicit GitTag is honoured
        shell: Rscript {0}
        run: |
          ref <- packageDescription("Require")$RemoteRef
          cat("RemoteRef:", ref, "\n")
          if (!identical(ref, "main")) {
            stop("GitTag: main installed '", ref, "'")
          }

  ## install-Rmd-pkgs and install-SpaDES carry an ordering dependency that an
  ## action cannot declare: both call `Require::setLinuxBinaryRepo()` as their
  ## first statement, so they die with "there is no package called 'Require'"
  ## unless install-Require ran earlier in the SAME job. That is not
  ## hypothetical -- SpaDES.core's own `render-module-rmd.yaml.template` calls
  ## install-Rmd-pkgs before install-Require. These jobs encode the order that
  ## actually works, and are where a regression in it would surface.
  install-Rmd-pkgs:
    name: install-Rmd-pkgs
    runs-on: ubuntu-latest
    ## ~8 packages plus their trees. Posit's Linux binaries are the fast path;
    ## a source fallback is what makes this slow when it is slow.
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2

      - uses: ./install-Require
      - uses: ./install-Rmd-pkgs

      - name: Assert every advertised package is installed
        shell: Rscript {0}
        run: |
          pkgs <- c("bookdown", "rmarkdown", "knitr",
                    "git2r", "kableExtra", "openxlsx", "pander",
                    "SpaDES.docs")
          have <- vapply(pkgs, function(p) nzchar(system.file(package = p)), logical(1))
          print(data.frame(package = pkgs, installed = have, row.names = NULL))
          if (any(!have)) {
            stop("install-Rmd-pkgs did not install: ",
                 paste(pkgs[!have], collapse = ", "))
          }
          ## Loading is the stronger assertion, but git2r's binary needs
          ## libgit2 at run time and the runner image does not ship it -- the
          ## org's module template apt-installs libgit2-dev for exactly that
          ## reason. Everything else must load.
          for (p in setdiff(pkgs, "git2r")) loadNamespace(p)
          cat("all loaded\n")

  install-SpaDES:
    name: install-SpaDES
    runs-on: ubuntu-latest
    ## The metapackage pulls SpaDES.core / SpaDES.tools / reproducible /
    ## quickPlot and their trees, and SpaDES.experiment builds from source.
    timeout-minutes: 75
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      ## Binaries are the fast path, but any source fallback in this tree
      ## (terra, sf, ...) needs the GDAL/GEOS/PROJ headers.
      - uses: ./install-spatial-deps

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          Ncpus: 2
          ## Not a CI workaround: the `SpaDES` metapackage was ARCHIVED on CRAN
          ## on 2026-07-13 ("requires archived package 'reproducible'"), so
          ## `Require::Require("SpaDES")` -- which is the whole of this action
          ## -- cannot resolve from CRAN today. r-universe carries
          ## 2.0.11.9000. `setLinuxBinaryRepo()` inserts Posit's binary repo
          ## *before* the CRAN mirror and preserves the rest of
          ## `getOption("repos")`, so this entry survives into the action.
          extra-repositories: https://predictiveecology.r-universe.dev

      - uses: ./install-Require
      - uses: ./install-SpaDES

      - name: Assert the SpaDES stack is installed
        shell: Rscript {0}
        run: |
          pkgs <- c("SpaDES", "SpaDES.core", "SpaDES.tools", "quickPlot",
                    "reproducible", "SpaDES.experiment")
          have <- vapply(pkgs, function(p) nzchar(system.file(package = p)), logical(1))
          print(data.frame(package = pkgs, installed = have, row.names = NULL))
          if (any(!have)) {
            stop("install-SpaDES did not install: ",
                 paste(pkgs[!have], collapse = ", "))
          }
          ## Installed-only on purpose. Whether these packages LOAD is what the
          ## R-CMD-check reusable workflow tests, in the repositories that own
          ## them; asserting it here would turn their breakages into this
          ## action's red check.
          cat("SpaDES", as.character(packageVersion("SpaDES")), "\n")
