## Self-test for this repository's own composite actions.
##
## Why this exists: the four reusable workflows here are `workflow_call:`-only,
## so nothing in this repository runs on a pull request. A change merges to
## `main` unverified and reaches every consumer pinned at `@main` on their next
## run -- today that is SpaDES, reproducible, SpaDES.core (workflows) and
## NetLogoR (install-spatial-deps). This is the gate that makes `@main` a safe
## default pin instead of a gamble.
##
## The actions are referenced by LOCAL path (`./setup-r-deps`), which resolves
## to the pull request's checkout rather than to `main`. That is the whole
## trick: it tests the code under review, so a new action can be verified
## BEFORE it exists on `main`, and `uses:`-cannot-take-an-expression never
## comes up.
##
## Scope limit, stated plainly: this covers the composite actions only. The
## reusable workflows cannot be self-tested as they stand, because they check
## out the caller at its root and run `R CMD check` there, and this repository
## has no DESCRIPTION at its root. Closing that gap needs a `working-directory`
## input threaded through the workflows -- worth doing, deliberately not done
## here.

name: self-test

on:
  pull_request:
    branches: [main]
    paths:
      - "setup-r-deps/**"
      - "stage-gdrive-auth/**"
      - "install-spatial-deps/**"
      - "install-Require/**"
      - "install-Rmd-pkgs/**"
      - "install-SpaDES/**"
      - "tests/fixture/**"
      - ".github/workflows/self-test.yaml"
      - ".github/workflows/ecosystem-test.yaml"
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-r-deps:
    name: setup-r-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./setup-r-deps
        id: deps
        with:
          working-directory: tests/fixture
          ## Distinct from the consumers' cache namespace, so a poisoned
          ## self-test cache can never be handed to a real package's build.
          cache-version: self-test-1
          extra-packages: any::sessioninfo

      ## `gdal-config --version` inside the action proves the HEADERS are
      ## present. Only a load proves the ABI matches -- and an ABI mismatch is
      ## exactly the failure the ubuntugis PPA removal is about, surfacing as
      ## `libgdal.so.34: cannot open shared object file` at lazy-load time.
      - name: Verify the spatial stack loads and reprojects
        shell: Rscript {0}
        run: |
          library(terra)
          cat("terra ", as.character(packageVersion("terra")), "\n")
          cat("GDAL  ", terra::gdal(), "\n")
          cat("PROJ  ", terra::gdal(lib = "proj"), "\n")
          cat("GEOS  ", terra::gdal(lib = "geos"), "\n")
          ## Reprojection reads proj.db. This is what the macOS PROJ_DATA step
          ## in setup-r-deps exists to make work; without it this errors with
          ## "Cannot find proj.db (GDAL error 1)".
          p <- terra::project(
            local({
              r <- terra::rast(nrows = 4, ncols = 4, xmin = 0, xmax = 1,
                               ymin = 0, ymax = 1, crs = "EPSG:4326")
              terra::values(r) <- seq_len(16)
              r
            }),
            "EPSG:3857"
          )
          stopifnot(terra::ncell(p) > 0, nzchar(terra::crs(p)))
          cat("reprojection OK\n")

      ## The end-to-end assertion: not that an ABI can be computed, but that it
      ## reached the value `setup-r-dependencies` was actually keyed under. That
      ## seam is where the two halves of the fix meet, and it is what silently
      ## regresses if either the delegated output or the local fallback breaks.
      - name: Assert the composed cache version carries the ABI
        shell: bash
        env:
          COMPOSED: ${{ steps.deps.outputs.cache-version }}
          ABI: ${{ steps.deps.outputs.abi }}
        run: |
          set -uo pipefail
          echo "composed cache-version: '${COMPOSED:-}'"
          echo "abi:                    '${ABI:-}'"

          if [ -z "${COMPOSED:-}" ]; then
            echo "::error::setup-r-deps did not report a cache-version"; exit 1
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            ## Must be byte-identical to the input, or every Windows consumer
            ## silently cold-builds on first run after this merges.
            if [ "$COMPOSED" != "self-test-1" ]; then
              echo "::error::Windows cache-version changed: '$COMPOSED' (expected 'self-test-1')"; exit 1
            fi
            echo "OK: Windows key unchanged"
            exit 0
          fi

          gdal="$(gdal-config --version 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$gdal" ]; then
            echo "::error::no system GDAL on a leg that requested system-deps"; exit 1
          fi
          if [ "$COMPOSED" != "self-test-1-$ABI" ]; then
            echo "::error::composed '$COMPOSED' is not 'self-test-1-$ABI'"; exit 1
          fi
          case "$ABI" in
            gdal${gdal}*) echo "OK: keyed under $COMPOSED" ;;
            *) echo "::error::ABI '$ABI' does not match installed GDAL $gdal"; exit 1 ;;
          esac

      - name: Session info
        if: always()
        shell: Rscript {0}
        run: sessioninfo::session_info()

  ## Regression test for the cache key carrying the geospatial ABI.
  ##
  ## The bug this guards: setup-r-dependencies' restore-key describes the OS, R
  ## version, arch and cache-version -- nothing about the SYSTEM libraries the
  ## compiled packages link against. A library built against a different GDAL
  ## restores cleanly and fails later at dlopen. The failure is silent at
  ## install time, so without a test a regression here shows up as somebody
  ## else's flaky spatial package, months later.
  ##
  ## Asserted directly on the action's output rather than by trying to poison a
  ## real cache: what must hold is that the ABI is reported, and that it reaches
  ## the key. A cache-poisoning test would need two runs and a runner whose
  ## system GDAL we can change, which we cannot do here.
  spatial-abi:
    name: spatial ABI in cache key (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      ## All three platforms on purpose. Windows must report an EMPTY ABI,
      ## which is what keeps existing Windows caches valid instead of silently
      ## cold-building. macOS is here because its branch of install-spatial-deps
      ## installs only `pkg-config gdal` -- geos-config and PROJ's .pc arrive as
      ## transitive brew dependencies, so this leg is what proves the probes
      ## degrade instead of failing the ~30 repositories that use this action.
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./install-spatial-deps
        id: spatial

      - name: Assert the ABI is well-formed for this platform
        shell: bash
        env:
          ABI: ${{ steps.spatial.outputs.abi }}
        run: |
          set -euo pipefail
          echo "abi='${ABI:-}'"
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "${ABI:-}" ]; then
              echo "::error::expected an empty ABI on Windows, got '$ABI'"; exit 1
            fi
            echo "OK: empty on Windows, so the cache key is unchanged there"
            exit 0
          fi
          ## GDAL is the one component that must always be identified: it is
          ## installed explicitly on every non-Windows platform, and its soname
          ## is the mismatch that actually bites (libgdal.so.37 vs .34).
          if ! printf '%s' "$ABI" | grep -Eq '^gdal[0-9]+\.[0-9]+'; then
            echo "::error::ABI does not start with a GDAL version: '$ABI'"; exit 1
          fi
          ## Whatever IS reported must match the installed libraries -- a stale
          ## or invented version would be worse than none, since it would key
          ## caches against a fiction.
          expect="gdal$(gdal-config --version | tr -d '[:space:]')"
          if geos="$(geos-config --version 2>/dev/null | tr -d '[:space:]')" && [ -n "$geos" ]; then
            expect="$expect-geos$geos"
          fi
          if proj="$(pkg-config --modversion proj 2>/dev/null | tr -d '[:space:]')" && [ -n "$proj" ]; then
            expect="$expect-proj$proj"
          fi
          if [ "$ABI" != "$expect" ]; then
            echo "::error::ABI '$ABI' does not match the installed libraries '$expect'"; exit 1
          fi
          echo "OK: $ABI"

      ## The output existing is only half of it -- it has to reach the key.
      ## This reproduces the composition step's logic and asserts the ABI is
      ## present for a spatial build and absent when system-deps is off.
      - name: Assert the ABI reaches the composed cache version
        shell: bash
        env:
          ABI: ${{ steps.spatial.outputs.abi }}
        run: |
          set -euo pipefail
          compose() { if [ -n "${2:-}" ]; then echo "$1-$2"; else echo "$1"; fi; }
          withAbi="$(compose 1 "${ABI:-}")"
          without="$(compose 1 "")"
          echo "with system-deps: $withAbi"
          echo "without:          $without"
          if [ "$without" != "1" ]; then
            echo "::error::a pure-R caller's cache key must be unchanged, got '$without'"; exit 1
          fi
          if [ "$RUNNER_OS" != "Windows" ] && [ "$withAbi" = "$without" ]; then
            echo "::error::the ABI did not reach the cache version"; exit 1
          fi
          echo "OK"

  ## Pure logic, no secret required: every branch of the credential sniffing is
  ## reachable with shape-only fixtures. This is the half that silently rots,
  ## because in a real run a broken branch just SKIPS the Drive-backed tests and
  ## the job still goes green.
  stage-gdrive-auth:
    name: stage-gdrive-auth (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - {name: "absent",         kind: "none",  present: "false", expect: "neither"}
          - {name: "dropped secret", kind: "none",  present: "true",  expect: "neither"}
          - {name: "R token (b64)",  kind: "token", present: "true",  expect: "token"}
          - {name: "undecodable",    kind: "junk",  present: "true",  expect: "neither"}
          ## A service-account key must be REFUSED, loudly. This case asserts
          ## the action fails the step rather than staging it or skipping --
          ## the regression it guards is a silent downgrade back to "green but
          ## uploads nothing".
          - {name: "service account", kind: "sa",   present: "true",  expect: "rejected"}
    steps:
      - uses: actions/checkout@v7

      ## None of these are credentials. The service-account fixture carries no
      ## key material -- the action only greps for the `"service_account"`
      ## marker -- and the token fixture is a gzip stream, which is what
      ## saveRDS() emits by default and all the action sniffs for.
      - name: Build shape-only fixtures
        id: fx
        shell: bash
        run: |
          set -euo pipefail
          sa='{"type":"service_account","project_id":"fixture-no-key-material"}'
          case "${{ matrix.case.kind }}" in
            none)  value="" ;;
            sa)    value="$(printf '%s' "$sa" | base64 -w0)" ;;
            token) value="$(printf 'fixture' | gzip -c | base64 -w0)" ;;
            junk)  value="$(printf 'not a credential at all' | base64 -w0)" ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - id: stage
        ## A rejected service account fails the step by design, so this must not
        ## abort the job before the assertion below can check that it did.
        continue-on-error: true
        uses: ./stage-gdrive-auth
        with:
          credential: ${{ steps.fx.outputs.value }}
          present: ${{ matrix.case.present }}

      - name: Assert the right output was set
        shell: bash
        env:
          TOKEN: ${{ steps.stage.outputs.token-path }}
          OUTCOME: ${{ steps.stage.outcome }}
          EXPECT: ${{ matrix.case.expect }}
        run: |
          set -euo pipefail
          got="neither"
          [ -n "${TOKEN:-}" ]        && got="token"
          [ "$OUTCOME" = "failure" ] && got="rejected"
          echo "expected=$EXPECT got=$got  (outcome=$OUTCOME token='${TOKEN:-}')"
          if [ "$got" != "$EXPECT" ]; then
            echo "::error::stage-gdrive-auth returned '$got', expected '$EXPECT'"
            exit 1
          fi
          ## A claimed path must actually exist and be non-empty; an output
          ## pointing at nothing would let the R side fail far from the cause.
          if [ "$got" = "token" ] && [ ! -s "$TOKEN" ]; then
            echo "::error::token-path was set but points at nothing"; exit 1
          fi
          echo "OK"

  ## install-spatial-deps has its own consumers (NetLogoR at @main; LandR, map
  ## and SpaDES.shiny on old tags), so it needs covering independently of
  ## setup-r-deps.
  ##
  ## Linux only, deliberately. setup-r-deps now delegates its spatial setup to
  ## this action, so the setup-r-deps (macOS) leg already exercises this action's
  ## macOS branch -- there is one implementation, not two that happen to match.
  ## A second macOS leg would re-run a ~3GB brew install (llvm, gcc, boost,
  ## aws-sdk-cpp, ~200s) at the 10x macOS billing rate to prove the same thing.
  ##
  ## Caveat: because setup-r-deps references this action at @main, the
  ## setup-r-deps legs test main's copy, not the branch's. Changes to this
  ## action are covered by THIS job, which uses the local path.
  install-spatial-deps:
    name: install-spatial-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./install-spatial-deps
      - name: Report what landed
        shell: bash
        run: |
          gdal-config --version
          geos-config --version
          ## NOT `proj --version`: the proj CLI lives in proj-bin, which
          ## libproj-dev does not pull in, and it is absent on the macOS runner
          ## too. The .pc file ships with the -dev package on both.
          pkg-config --modversion proj
