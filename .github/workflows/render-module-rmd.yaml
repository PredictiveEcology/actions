## Reusable workflow: re-render a SpaDES module's .Rmd to .html and commit it.
##
## Callers keep only their triggers and the module name. See issue #36 for the
## survey this replaces: 74 module repositories carry a hand-generated copy of
## this job, split across two generations that had drifted apart, and between
## them they pin five actions from this repository at v0/v0.0.1/v0.2 -- which is
## what blocks retiring those tags.
##
## Assumes the module name equals the repository name. That is already baked
## into the generated file this replaces (see the `paths = ".."` note below) and
## holds for every module surveyed.

name: render-module-rmd

on:
  workflow_call:
    inputs:
      depends-on-virtual-bump:
        description: >-
          Opt in. For each open `Depends-on: owner/repo#N` PR, resolve the dependencies
          against a copy of that PR with its Version raised by one (the post-merge
          bump), so a floor written as the post-merge version is met. Default false:
          the PR is installed after the dependency solve, as before.
        type: boolean
        default: false
      depends-on-gate:
        description: >-
          Opt in. Skip the jobs while an upstream `Depends-on:` PR has pending or failed
          checks; they run once it is green or merged (see depends-on-rerun.yaml for the
          automatic re-run). Default false.
        type: boolean
        default: false
      module:
        description: >-
          Module name, i.e. the basename of <module>.R / <module>.Rmd. Must match
          the repository name, unless `module-dir` is given.
        required: true
        type: string
      module-dir:
        description: >-
          Folder holding the module, relative to the repository root, for a
          repository with several modules (e.g. `modules/scfmSpread`); its last
          part must be the module name. Empty (the default): the repository root,
          which must then be named after the module.
        required: false
        type: string
        default: ""
      r-version:
        description: "R version passed to setup-r."
        required: false
        type: string
        default: "release"
      system-deps:
        description: >-
          Install the geospatial system libraries (GDAL/GEOS/PROJ/udunits).
          Nearly every module needs them; set false for one that does not.
        required: false
        type: boolean
        default: true
      extra-apt:
        description: >-
          Additional apt packages, space-separated. Modules have no DESCRIPTION,
          so nothing can derive their system requirements automatically -- this
          is the escape hatch for a module that needs something beyond the
          common set installed below.
        required: false
        type: string
        default: ""

## Inside a called workflow `github.workflow` resolves to the CALLER's workflow
## name, so without the `-reusable` suffix this key collides with the identical
## expression in a caller that declares its own concurrency -- the called
## workflow then waits on a group its own parent holds and GitHub cancels the
## run before any job starts. See #33.
## Named after this workflow and the module: `github.workflow` is the caller, and a
## caller running both workflows for several modules (examples/multi-module.caller.yaml)
## would otherwise put each module's test and render in one group and cancel one.
concurrency:
  group: ${{ github.workflow }}-render-module-rmd-${{ github.ref }}-${{ inputs.module }}-reusable
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

## Default deny; each job re-grants only what it needs. The calling job must
## itself grant `contents: write`, since a called workflow can only reduce the
## caller's permissions, never widen them.
permissions: {}

## Split into two jobs on purpose, as in citation.yaml (#35). Rendering a module
## installs its whole dependency tree and then EXECUTES the module's own .Rmd.
## Committing the result needs a write-scoped token. Those two things must not
## share a job, or all of that third-party code runs alongside a token that can
## push to the repository.
jobs:
  ## Opt-in (`depends-on-gate`): holds the other jobs back while an upstream
  ## `Depends-on:` PR is pending or failed. Skipped by default. See
  ## install-depends-on/README.md.
  depends-on-gate:
    if: ${{ inputs.depends-on-gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      config: ${{ steps.gate.outputs.config }}
    steps:
      - id: gate
        uses: PredictiveEcology/actions/install-depends-on@main
        with:
          mode: gate
          hold: ${{ inputs.depends-on-gate }}

  render:
    needs: depends-on-gate
    ## A skipped gate (the default) lets the job run exactly as before.
    if: ${{ !cancelled() && needs.depends-on-gate.result != 'failure' && (needs.depends-on-gate.result == 'skipped' || needs.depends-on-gate.outputs.ready == 'true') }}
    name: Render module Rmd
    runs-on: ubuntu-latest
    ## Without a cap a hung dependency install runs to GitHub's 6 h default and holds this
    ## module's concurrency group; successful runs take a median 7-9 min, at most 39 (2026-10).
    timeout-minutes: 60
    permissions:
      contents: read
    ## Every GitHub install in this job -- remotes::install_github() for Require,
    ## then Require::Require() for each `owner/repo@ref` in the module's reqdPkgs
    ## -- calls the GitHub API. Without a token they run unauthenticated, fall back
    ## to the bundled PAT ("Using bundled GitHub PAT. Please add your own..."), and
    ## fail on its rate limit:
    ##   cannot open URL 'https://api.github.com/repos/PredictiveEcology/Require/contents/DESCRIPTION?ref=development'
    ## The generated file this workflow replaces set this at job level; the refactor
    ## kept GH_TOKEN for the commit job's `git push` but dropped GITHUB_PAT here.
    ## GITHUB_TOKEN is available to a called workflow without `secrets: inherit`.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ## The commit job supplies its own token; nothing here needs a
          ## credential left behind in .git/config.
          persist-credentials: false

      - if: ${{ inputs.system-deps }}
        uses: PredictiveEcology/actions/install-spatial-deps@main

      ## The generated file ran a bare `sudo apt-get install` with no
      ## `apt-get update`, no retries and no timeout. A composite-action step
      ## cannot use `timeout-minutes`, so a stalled mirror burns the full 6h job
      ## ceiling -- that is what happened to two LandWebUtils jobs on 2026-08-19.
      ## Same retry wrapper install-spatial-deps uses.
      - name: Install other system dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          EXTRA_APT: ${{ inputs.extra-apt }}
        run: |
          set -euo pipefail
          retry() {
            local n
            for n in 1 2 3; do
              if timeout --kill-after=60s "$1" bash -c "$2"; then return 0; fi
              echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
              sleep $((n * 15))
            done
            echo "::error::'$2' still failing after 3 attempts"
            return 1
          }
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          retry 5m  "sudo -E apt-get update -y"
          retry 10m "sudo -E NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
                       libcurl4-openssl-dev libgit2-dev libglpk-dev libmagick++-dev \
                       libxml2-dev python3-gdal ${EXTRA_APT}"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          use-public-rspm: true
          Ncpus: 2

      - uses: r-lib/actions/setup-pandoc@v2

      ## Order matters and is not cosmetic: install-Rmd-pkgs and install-SpaDES
      ## both open with `Require::setLinuxBinaryRepo()`, so Require has to exist
      ## before either runs. This is the order the generated file used.
      - uses: PredictiveEcology/actions/install-Require@main

      - uses: PredictiveEcology/actions/install-SpaDES@main

      - uses: PredictiveEcology/actions/install-Rmd-pkgs@main

      ## `mp` is ".." by default, and that is not a typo. actions/checkout puts the
      ## repository at /home/runner/work/<repo>/<repo>, so the working directory is
      ## itself named after the module and its parent is the module *directory*
      ## SpaDES.core expects. This is why the module name has to match the
      ## repository name, unless `module-dir` names the module's folder; then
      ## `mp` is that folder's parent.
      ## Opt-in (`depends-on-virtual-bump`): before the module's reqdPkgs resolve, so
      ## a floor written as the post-merge version of a `Depends-on:` PR is met.
      - if: ${{ inputs.depends-on-virtual-bump }}
        uses: PredictiveEcology/actions/install-depends-on@main
        with:
          mode: prepare
          preinstall: true

      - name: Install module package dependencies
        shell: Rscript {0}
        env:
          MODULE: ${{ inputs.module }}
          MODULE_DIR: ${{ inputs.module-dir }}
        run: |
          ## packages() returns one element per module, and that element is the
          ## character vector of that module's reqdPkgs. Indexing it twice --
          ## `packages(...)[[1]]` and then `pkgs[[1]]` -- reduces 20 packages to
          ## the string "SpaDES.core", so the render then died on the first
          ## reqdPkg it touched ("there is no package called 'fireSenseUtils'").
          ## Index once, as the generated file this workflow replaces did.
          m <- Sys.getenv("MODULE")
          md <- Sys.getenv("MODULE_DIR"); mp <- if (nzchar(md)) dirname(md) else ".."
          pkgs <- SpaDES.core::packages(modules = m, paths = mp)
          Require::Require(pkgs[[1]])

      ## After the dependency install on purpose, so a `Depends-on:` PR overrides it.
      - uses: PredictiveEcology/actions/install-depends-on@main

      - name: Render module Rmd
        shell: Rscript {0}
        env:
          MODULE: ${{ inputs.module }}
          MODULE_DIR: ${{ inputs.module-dir }}
        run: |
          m <- Sys.getenv("MODULE")
          md <- Sys.getenv("MODULE_DIR"); mp <- if (nzchar(md)) dirname(md) else ".."
          rmarkdown::render(file.path(if (nzchar(md)) md else ".", paste0(m, ".Rmd")),
                            encoding = "UTF-8")

      ## The .md as well as the .html. A module .Rmd that sets `keep_md: yes` -- most
      ## of them -- leaves `<module>.md` beside the .html, and that .md is what the
      ## repo's README.md symlinks to. Uploading only the .html meant the rendered
      ## manual stayed current while the repo front page drifted: Biomass_borealDataPrep's
      ## README still documented two parameters that had been removed. `if-no-files-found`
      ## fires only when NOTHING matches, so a module without `keep_md` is unaffected.
      - uses: actions/upload-artifact@v7
        with:
          name: module-html-${{ inputs.module }}
          path: |
            ${{ inputs.module-dir || '.' }}/${{ inputs.module }}.html
            ${{ inputs.module-dir || '.' }}/${{ inputs.module }}.md
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: render
    ## Only on a push. The generated file also ran this on pull_request, where
    ## `github.ref` is refs/pull/N/merge and the push cannot succeed -- it failed
    ## silently every time, swallowed by `|| echo "No changes to commit"`.
    ## Keep `!cancelled()`: without a status function GitHub applies success(), which
    ## is false if any upstream job was skipped, as depends-on-gate is by default.
    if: ${{ !cancelled() && needs.render.result == 'success' && github.event_name == 'push' }}
    name: Commit rendered files (only pushes to main/development)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      ## One artifact per module: a repository with several modules calls this workflow
      ## once per module in the same run. Into a scratch folder, not the checkout: the
      ## next step resets the checkout to the branch tip, then copies these files in.
      - uses: actions/download-artifact@v8
        with:
          name: module-html-${{ inputs.module }}
          path: ${{ runner.temp }}/render

      - name: Commit results
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE: ${{ inputs.module }}
          MODULE_DIR: ${{ inputs.module-dir }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d="${MODULE_DIR:-.}"
          src="${RUNNER_TEMP}/render"
          ## Commit onto the branch tip, replacing the rendered files whole, so nothing is
          ## merged. The checkout is the commit that triggered this run, and the branch
          ## may have moved since: the previous run's render of this module, or the other
          ## modules' commits in a repository with several. A rebase onto the previous
          ## render conflicted on every attempt, as both renders change the same or
          ## adjacent lines (version, date, commit SHA); the job failed and the newer
          ## render was lost (#65). Runs for one module wait for each other (the
          ## concurrency group above), so the render pushed last is from the newest push.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            if git fetch --depth=1 "$remote" "${GITHUB_REF_NAME}"; then
              git reset --hard FETCH_HEAD
              cp "${src}/${MODULE}.html" "${d}/${MODULE}.html"
              git add "${d}/${MODULE}.html"
              ## Only when the module renders one; `cp` of a missing file fails, and
              ## under `set -e` that would take the whole job down for those modules.
              if [ -f "${src}/${MODULE}.md" ]; then
                cp "${src}/${MODULE}.md" "${d}/${MODULE}.md"
                git add "${d}/${MODULE}.md"
              fi
              ## `git commit` exits non-zero when nothing is staged, which is the
              ## normal no-change case -- exit cleanly rather than pushing.
              git commit -m "Re-build ${MODULE}.Rmd" || exit 0
              ## Rejected when another commit landed after the fetch: the next attempt
              ## fetches again and rebuilds the commit on the new tip.
              git push "$remote" "HEAD:${GITHUB_REF_NAME}" && exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
