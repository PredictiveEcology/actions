# Reusable R CMD check workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: R-CMD-check
#   on:
#     push: { branches: [main, master, development] }
#     pull_request: { branches: [main, master, development] }
#   jobs:
#     R-CMD-check:
#       uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@v0
#       secrets: inherit
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
name: R-CMD-check

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""
      error-on:
        description: "R expression passed to check-r-package's error-on (e.g. '\"warning\"', '\"error\"'). Defaults to \"warning\" (check-r-package's own default)."
        type: string
        default: '"warning"'
      dependencies:
        description: "R expression for setup-r-dependencies' `dependencies` input. Use NA when transitive Suggests resolution conflicts (then add the needed Suggests directly via extra-packages)."
        type: string
        default: '"all"'
      check-args:
        description: "R expression passed to check-r-package's `args` (the R CMD check flags). Defaults to c(\"--no-manual\", \"--as-cran\"). Set e.g. c(\"--no-manual\", \"--as-cran\", \"--run-dontrun\", \"--run-donttest\") to also run \\dontrun/\\donttest examples (as CRAN does)."
        type: string
        default: 'c("--no-manual", "--as-cran")'
      extra-config:
        description: "Extra matrix legs appended via `include` (JSON array of {config:{...}} objects). Default none. E.g. '[{\"config\":{\"os\":\"windows-latest\",\"nosuggests\":false,\"r\":\"oldrel-2\"}}]' to also test an older R."
        type: string
        default: "[]"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   nosuggests: false, r: 'release'}
          - {os: windows-latest, nosuggests: false, r: 'devel'}
          - {os: windows-latest, nosuggests: false, r: 'release'}
          - {os: windows-latest, nosuggests: false, r: 'oldrel-1'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'devel'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'release'}
          - {os: ubuntu-latest,   nosuggests: true,  r: 'release'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-1'}
        # Optional caller-supplied extra legs (default none). See extra-config input.
        include: ${{ fromJSON(inputs.extra-config) }}

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v5

      # setup-pandoc occasionally fails with HTTP 5xx (CDN blip).
      # Three attempts with continue-on-error ride out transient failures.
      - id: pandoc1
        continue-on-error: true
        uses: r-lib/actions/setup-pandoc@v2
      - if: steps.pandoc1.outcome == 'failure'
        id: pandoc2
        continue-on-error: true
        uses: r-lib/actions/setup-pandoc@v2
      - if: steps.pandoc1.outcome == 'failure' && steps.pandoc2.outcome == 'failure'
        uses: r-lib/actions/setup-pandoc@v2

      # Install geospatial system deps WITHOUT the ubuntugis-unstable PPA.
      # That PPA installs libgdal37 (GDAL 3.11.x), but Posit's noble binary cache
      # builds quickPlot/sf/terra against the Ubuntu-default libgdal34 -- the ABI
      # mismatch surfaces as `libgdal.so.34: cannot open shared object file` when
      # quickPlot loads (and fails the whole check via SpaDES.core lazy-load).
      - name: Install geospatial system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev
        shell: bash
      - name: Install geospatial system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          brew install gdal
        shell: zsh {0}

      # Homebrew's gdal/proj install does not always leave proj.db on PROJ's
      # default search path. Without it, terra::project()/terra::crs() emit
      # "PROJ: proj_identify: Cannot find proj.db (GDAL error 1)" and any
      # reprojection-touching test fails. Point PROJ at Homebrew's data dir.
      - name: Configure PROJ data path (macOS)
        if: runner.os == 'macOS'
        run: |
          PROJ_PREFIX="$(brew --prefix proj 2>/dev/null || true)"
          PROJ_DATA="$PROJ_PREFIX/share/proj"
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/opt/homebrew/share/proj"; fi
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/usr/local/share/proj"; fi
          echo "PROJ_DATA=$PROJ_DATA" >> "$GITHUB_ENV"
          echo "PROJ_LIB=$PROJ_DATA"  >> "$GITHUB_ENV"
          echo "Using PROJ_DATA=$PROJ_DATA"
          ls -1 "$PROJ_DATA" | head -5 || true

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://PredictiveEcology.r-universe.dev/'
          Ncpus: 2
          r-version: ${{ matrix.config.r }}
          # Posit Public Package Manager — pre-built Windows + macOS binaries
          # served from a CDN. More reliable than CRAN mirrors for binaries.
          use-public-rspm: true

      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pin pak to its stable channel; devel occasionally regresses.
          pak-version: stable
          dependencies: ${{ inputs.dependencies }}
          extra-packages: |
            any::rcmdcheck
            ${{ inputs.extra-packages }}

      # Fallback when setup-r-dependencies fails (most often a transient
      # binary-fetch failure under pak). Up to 3 attempts with 60s backoff.
      # `nick-fields/retry@v3` does not accept `shell: Rscript {0}`, so we
      # invoke Rscript -e from bash.
      - name: Install R deps (retry fallback)
        if: steps.deps.outcome == 'failure'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          retry_on: error
          shell: bash
          command: |
            Rscript -e 'install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")' \
                    -e 'pak::local_install_dev_deps(ask = FALSE, dependencies = TRUE)' \
                    -e 'pak::pkg_install("any::rcmdcheck", ask = FALSE)'

      - name: Install additional package dependencies
        if: ${{ inputs.post-install != '' }}
        run: ${{ inputs.post-install }}
        shell: Rscript {0}

      # RcppParallel bundles TBB and its ABI is a property of the RcppParallel
      # build, not the toolchain. When RcppParallel changes that ABI, every
      # package linking it must be rebuilt -- 6.0.0 (2026-07-23) moved to
      # oneTBB 2022.0.0 and its NEWS says as much. Repositories that have not
      # yet rebuilt still serve binaries against the old ABI; those install
      # without complaint and only fail at `dlopen`, e.g. on macOS-arm64:
      #   qs2.so:        missing tbb::task::note_affinity
      #   stringfish.so: missing tbb::internal::concurrent_vector_base_v3::internal_grow_by
      # When such a package is in Imports, this kills `R CMD build` at the
      # install-to-build-vignettes stage, before any check output exists.
      #
      # Probe rather than pin a version: we cannot know which release fixes a
      # given mismatch, but we can ask whether it loads. No-op once the binaries
      # are healthy, so this needs no maintenance and costs nothing when unused.
      # RcppParallel itself is excluded -- building it from source needs cmake.
      - name: Rebuild RcppParallel-linked packages that fail to load
        shell: Rscript {0}
        run: |
          ip <- installed.packages()
          links <- vapply(rownames(ip), function(p)
            any(grepl("\\bRcppParallel\\b", ip[p, c("Depends", "Imports", "LinkingTo")])),
            logical(1))
          cands <- setdiff(rownames(ip)[links], "RcppParallel")
          loads <- function(p) requireNamespace(p, quietly = TRUE)
          broken <- Filter(Negate(loads), cands)
          if (length(broken)) {
            message("These link RcppParallel ", packageVersion("RcppParallel"),
                    " but fail to load; rebuilding from source: ",
                    paste(broken, collapse = ", "))
            # dependencies first, so e.g. stringfish is rebuilt before qs2 --
            # rebuilding a package against a still-broken dependency just fails again
            deps <- tools::package_dependencies(broken, db = ip, recursive = TRUE)
            nDeps <- vapply(broken, function(p) sum(broken %in% deps[[p]]), integer(1))
            for (p in broken[order(nDeps)]) install.packages(p, type = "source")
            stillBroken <- Filter(Negate(loads), broken)
            if (length(stillBroken))
              stop("still failing to load after a source rebuild: ",
                   paste(stillBroken, collapse = ", "))
          }

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: ${{ inputs.error-on }}
          args: ${{ inputs.check-args }}
