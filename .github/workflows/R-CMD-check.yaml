# Reusable R CMD check workflow for PredictiveEcology R packages.
#
# Call it from a package repo (which owns the triggers), e.g.:
#
#   name: R-CMD-check
#   on:
#     push: { branches: [main, master, development] }
#     pull_request: { branches: [main, master, development] }
#   jobs:
#     R-CMD-check:
#       uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
#       ## Name the secrets you pass. `secrets: inherit` also works, but hands
#       ## this workflow EVERY secret the calling repo can see -- including to
#       ## the third-party packages that `post-install` installs. Omit the block
#       ## entirely if the package has no Google Drive-backed tests.
#       secrets:
#         GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
#       with:
#         extra-packages: |
#           PredictiveEcology/Require@development
name: R-CMD-check

on:
  workflow_call:
    inputs:
      extra-packages:
        description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
        type: string
        default: ""
      post-install:
        description: "Optional Rscript run after dependency install (e.g. NLMR/fastshp)."
        type: string
        default: ""
      error-on:
        description: "R expression passed to check-r-package's error-on (e.g. '\"warning\"', '\"error\"'). Defaults to \"warning\" (check-r-package's own default)."
        type: string
        default: '"warning"'
      dependencies:
        description: "R expression for setup-r-dependencies' `dependencies` input. Use NA when transitive Suggests resolution conflicts (then add the needed Suggests directly via extra-packages)."
        type: string
        default: '"all"'
      check-args:
        description: "R expression passed to check-r-package's `args` (the R CMD check flags). Defaults to c(\"--no-manual\", \"--as-cran\"). Set e.g. c(\"--no-manual\", \"--as-cran\", \"--run-dontrun\", \"--run-donttest\") to also run \\dontrun/\\donttest examples (as CRAN does)."
        type: string
        default: 'c("--no-manual", "--as-cran")'
      extra-config:
        description: "Extra matrix legs appended via `include` (JSON array of {config:{...}} objects). Default none. E.g. '[{\"config\":{\"os\":\"windows-latest\",\"nosuggests\":false,\"r\":\"oldrel-2\"}}]' to also test an older R."
        type: string
        default: "[]"
      cache-version:
        description: "Bump to invalidate the dependency cache. Exposed so a caller can clear a poisoned library (e.g. a terra built against the wrong libgdal) without a PR to this repo."
        type: string
        default: "1"
      extra-repositories:
        description: >-
          Extra repositories for setup-r. Defaults to the PredictiveEcology
          r-universe, which is what this workflow hardcoded before it was
          exposed -- so existing callers are unaffected. Worth setting to "" for
          a package whose dependencies are all on CRAN: r-universe serves
          development versions, so leaving it on risks checking against a
          dependency version CRAN will never have.
        type: string
        default: "https://PredictiveEcology.r-universe.dev/"
      build-args:
        description: "R expression passed to check-r-package's `build_args` (the R CMD build flags). Defaults to c(\"--no-manual\", \"--compact-vignettes=gs+qpdf\") so PDF vignettes are compacted for all packages (smaller installed size, avoids CRAN NOTEs; a no-op when there are no PDF vignettes). Override to change."
        type: string
        default: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      extra-env:
        description: >-
          Extra environment variables for the whole job, as newline-separated
          KEY=VALUE lines (blank lines and #-comments ignored). Applied before
          anything is installed, so it reaches dependency resolution as well as
          the check. Exists because per-package CI legitimately needs env this
          workflow cannot enumerate -- OMP_THREAD_LIMIT, R_KEEP_PKG_SOURCE,
          _R_CHECK_THINGS_IN_OTHER_DIRS_ -- and without it those packages
          cannot move off their own workflows without silently losing settings.
        type: string
        default: ""
    secrets:
      GOOGLEDRIVE_AUTH:
        description: >-
          Google Drive credential: a base64-encoded serialized R user OAuth
          token (saveRDS of a gargle/httr token). Base64 is required, not
          preferred -- the token is binary, and a multi-line raw value is
          dropped by Windows runners. Service-account keys are REJECTED: a
          service account has no Drive quota on user-owned folders, so it
          authenticates but cannot complete an upload round-trip. Optional --
          Drive-backed tests skip without it.
        required: false

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # The nosuggests discriminator is load-bearing, not cosmetic. Without it
    # this matrix produces two jobs both called `ubuntu-latest (release)`:
    # you cannot tell from the checks list whether the no-suggests leg
    # passed, branch protection cannot name it as a required check, and if
    # it silently stopped being generated nobody would notice. Appended only
    # when true, so the other job names stay stable for branch protection.
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.nosuggests && ', nosuggests' || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   nosuggests: false, r: 'release'}
          - {os: windows-latest, nosuggests: false, r: 'devel'}
          - {os: windows-latest, nosuggests: false, r: 'release'}
          - {os: windows-latest, nosuggests: false, r: 'oldrel-1'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'devel'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'release'}
          - {os: ubuntu-latest,   nosuggests: true,  r: 'release'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-1'}
        # Optional caller-supplied extra legs (default none). See extra-config input.
        include: ${{ fromJSON(inputs.extra-config) }}

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Lets a package's tests tell the matrix legs apart, so a test that must
      # run on exactly one runner (e.g. a slow upload round-trip that would race
      # with itself across legs) can gate on it. Value is the leg's R spec:
      # 'release', 'devel', 'oldrel-1', ...
      R_VERSION_LABEL: ${{ matrix.config.r }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v7

      # Applied before setup-r-deps so it reaches dependency resolution too,
      # not just the check. See the extra-env input for why this exists.
      - name: Apply caller-supplied environment
        if: inputs.extra-env != ''
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXTRA_ENV" | while IFS= read -r line; do
            [ -z "$(printf '%s' "$line" | tr -d '[:space:]')" ] && continue
            case "$line" in
              \#*) continue ;;
              *=*) ;;
              *) echo "::error::extra-env expects KEY=VALUE per line, got: $line"; exit 1 ;;
            esac
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            echo "  set ${line%%=*}"
          done

      # Everything from pandoc through the dependency install now lives in the
      # setup-r-deps composite action, so a job that is not running R CMD check
      # can reuse it. See PredictiveEcology/actions#24.
      - uses: PredictiveEcology/actions/setup-r-deps@main
        with:
          r-version: ${{ matrix.config.r }}
          dependencies: ${{ inputs.dependencies }}
          cache-version: ${{ inputs.cache-version }}
          extra-repositories: ${{ inputs.extra-repositories }}
          post-install: ${{ inputs.post-install }}
          extra-packages: |
            any::rcmdcheck
            ${{ inputs.extra-packages }}

      # Staged as late as possible: every step above installs and runs
      # third-party code, and none of it needs this credential. Only
      # check-r-package below receives it, via a step-level `env:`.
      - name: Stage Google Drive credentials
        id: gdrive-auth
        uses: PredictiveEcology/actions/stage-gdrive-auth@main
        with:
          credential: ${{ secrets.GOOGLEDRIVE_AUTH }}
          present: ${{ secrets.GOOGLEDRIVE_AUTH != '' }}


      - uses: r-lib/actions/check-r-package@v2
        env:
          # Path to the staged user OAuth token, or empty -> the R side sees an
          # unset var and skips, exactly as it does locally. GOOGLEDRIVE_AUTH is
          # deliberately NOT exported: that was the service-account path, and
          # service accounts are no longer accepted.
          GDRIVE_OAUTH_TOKEN: ${{ steps.gdrive-auth.outputs.token-path }}
        with:
          upload-snapshots: true
          error-on: ${{ inputs.error-on }}
          args: ${{ inputs.check-args }}
          build_args: ${{ inputs.build-args }}

      # check-r-package ships a "Show testthat output" step, but it greps
      # `testthat.Rout*` -- i.e. it assumes the conventional tests/testthat.R
      # driver. A package using any other driver file (reproducible drives its
      # suite from tests/test-all.R, giving test-all.Rout) matches nothing, and
      # the step emits an empty group.
      #
      # That is worth fixing because R CMD check prints the testthat summary
      # ONLY when tests fail. For those packages a green run therefore carries
      # no record of skip/pass counts anywhere, and `Status: OK` reads the same
      # whether the suite ran a thousand tests or never ran at all -- which is
      # exactly how a leg silently skipping its entire suite stayed green.
      #
      # testthat.Rout* is excluded; the upstream step already prints it.
      - name: Show test output
        if: always()
        shell: bash
        run: |
          find check -path '*/tests/*' \( -name '*.Rout' -o -name '*.Rout.fail' \) \
            ! -name 'testthat.Rout*' \
            | while read -r f; do
                echo "::group::$f"
                cat "$f"
                echo "::endgroup::"
              done
