# Keeps this repository's own pins on third-party actions current.
#
# Expect few pull requests. Every third-party pin here floats on a major tag
# (`actions/checkout@v7`, `r-lib/actions/setup-r@v2`, ...), so patches and
# minors already arrive through the moving tag and Dependabot stays quiet. It
# opens a pull request only when a major moves -- checkout v7 to v8 -- which
# is the case that needs a human to read a changelog anyway.
#
# Nothing here affects how callers reference this repository. A `uses:` pinned
# to a branch is not a version, so Dependabot's parser drops it before any
# rule applies: `PredictiveEcology/actions/...@main` is never seen as a
# dependency, and no `ignore:` entry is needed to protect it.
#
# Why every composite action directory is named: with `directory: "/"`
# Dependabot reads `.github/workflows/` and an `action.yml` in the repository
# root, and nothing else. Composite actions in subdirectories are invisible
# to it unless listed (dependabot/dependabot-core#6949). The `directories:`
# glob form would shorten this, but a glob overlaps the implicit
# `.github/workflows` scan and raises duplicate pull requests
# (dependabot/dependabot-core#10884); an explicit list does not overlap.
#
# That list is hand-maintained, and a stale one fails silently -- a new
# action's pins simply go unchecked. The `dependabot-directories` job in
# `self-test.yaml` fails the build if this list and the composite action
# directories on disk diverge.
#
# `group-by: dependency-name` is what makes one block preferable to one block
# per directory: groups cannot span update entries, so separate blocks would
# open a pull request per directory for a dependency used in more than one
# (`actions/upload-artifact` in `/` and `/revdeps-check`; the three
# `r-lib/actions` and `nick-fields/retry` in `/` and `/setup-r-deps`). This
# gives one pull request per dependency, covering every directory at once.
# The group defines no `patterns`, which matches every dependency.
#
# The filename must be `dependabot.yml`; GitHub does not read
# `dependabot.yaml`, despite the `.yaml` used for workflows in this repo.

version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /install-Require
      - /install-apt-packages
      - /install-Rmd-pkgs
      - /install-SpaDES
      - /install-depends-on
      - /install-spatial-deps
      - /revdeps-check
      - /setup-r-deps
      - /stage-gdrive-auth
      - /unpin-remotes
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        group-by: dependency-name
