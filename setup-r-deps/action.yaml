name: 'setup-r-deps'
description: >-
  Everything needed to get an R package's dependencies installed the
  PredictiveEcology way: pandoc, geospatial system libraries, R itself, and the
  dependency install with a retry fallback. Extracted from the R-CMD-check
  reusable workflow so a job that is NOT running R CMD check -- a benchmark, an
  ad-hoc matrix leg, a coverage run with different flags -- can reuse it
  without inheriting the check.
author: 'Alex Chubaty'

inputs:
  r-version:
    description: "R version passed to r-lib/actions/setup-r."
    required: false
    default: "release"
  dependencies:
    description: >-
      R expression for setup-r-dependencies' `dependencies` input. Use NA when
      transitive Suggests resolution conflicts (then add the needed Suggests
      directly via extra-packages).
    required: false
    default: '"all"'
  extra-packages:
    description: "Packages appended to setup-r-dependencies `extra-packages` (newline-separated)."
    required: false
    default: ""
  pak-version:
    description: >-
      pak release channel. Defaults to `stable`; devel occasionally regresses.
    required: false
    default: "stable"
  cache-version:
    description: >-
      Bump to invalidate the dependency cache. Exposed because the cache
      restore-key carries no discriminator for the dependency set, so a leg can
      inherit a sibling leg's library -- and a poisoned cache (e.g. a terra
      built against the wrong libgdal) otherwise needs a PR to THIS repo to
      clear.
    required: false
    default: "1"
  extra-repositories:
    description: >-
      Extra repositories for setup-r. Defaults to empty: r-universe serves
      development versions, so enabling it by default risks checking a package
      against a dependency CRAN will not have. Set it only where a
      PredictiveEcology-only dependency is genuinely needed.
    required: false
    default: ""
  use-public-rspm:
    description: >-
      Use Posit Public Package Manager for pre-built binaries. Faster and more
      reliable than CRAN mirrors for Windows/macOS.
    required: false
    default: "true"
  ncpus:
    description: "Ncpus passed to setup-r."
    required: false
    default: "2"
  pandoc:
    description: "Whether to install pandoc. Set false for jobs that never render."
    required: false
    default: "true"
  system-deps:
    description: >-
      Whether to install the geospatial system libraries (GDAL/GEOS/PROJ/udunits).
      Set false for a pure-R package.
    required: false
    default: "true"
  post-install:
    description: "Optional Rscript run after the dependency install (e.g. NLMR/fastshp)."
    required: false
    default: ""
  working-directory:
    description: "Directory containing the package's DESCRIPTION."
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    # setup-pandoc occasionally fails with HTTP 5xx (CDN blip). Three attempts
    # with continue-on-error ride out transient failures.
    - id: pandoc1
      if: inputs.pandoc == 'true'
      continue-on-error: true
      uses: r-lib/actions/setup-pandoc@v2
    - if: inputs.pandoc == 'true' && steps.pandoc1.outcome == 'failure'
      id: pandoc2
      continue-on-error: true
      uses: r-lib/actions/setup-pandoc@v2
    - if: inputs.pandoc == 'true' && steps.pandoc1.outcome == 'failure' && steps.pandoc2.outcome == 'failure'
      uses: r-lib/actions/setup-pandoc@v2

    # Geospatial system deps WITHOUT the ubuntugis-unstable PPA. That PPA
    # installs libgdal37 (GDAL 3.11.x), but Posit's noble binary cache builds
    # quickPlot/sf/terra against the Ubuntu-default libgdal34 -- the ABI
    # mismatch surfaces as `libgdal.so.34: cannot open shared object file` when
    # quickPlot loads, and fails the whole check via a lazy-load.
    #
    # NOTE on timeouts: composite-action steps do NOT support `timeout-minutes`
    # (actions/runner#1979 -- and it is not honoured on the step that *calls* a
    # composite action either). Two independent Ubuntu-24.04 hangs are guarded
    # here without it:
    #  (1) apt's post-install needrestart/debconf can block on an interactive
    #      prompt -> DEBIAN_FRONTEND=noninteractive / NEEDRESTART_MODE=a, passed
    #      through `sudo -E`, which otherwise resets the environment.
    #  (2) GitHub's azure.archive.ubuntu.com mirror intermittently returns Ign
    #      and apt fails over to archive.ubuntu.com, but with no per-connection
    #      timeout a stalled fetch hangs until the job's 6h ceiling. Observed
    #      2026-08-19: two LandWebUtils jobs sat here for 6h0m and were killed.
    #      Short acquire timeouts plus the GNU `timeout` wrapper below make a
    #      dead connection abort in ~30s and fail over instead of hanging.
    - name: Install geospatial system dependencies (Linux)
      if: inputs.system-deps == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
        # GNU timeout stands in for the unsupported `timeout-minutes`, and gives
        # a per-command cap rather than one cap for the whole step.
        retry() {
          local n
          for n in 1 2 3; do
            if timeout --kill-after=60s "$1" bash -c "$2"; then
              return 0
            fi
            echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
            sleep $((n * 15))
          done
          echo "::error::'$2' still failing after 3 attempts"
          return 1
        }
        retry 5m  "sudo -E DEBIAN_FRONTEND=noninteractive apt-get update -y"
        retry 10m "sudo -E DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
                     apt-get install -y --no-install-recommends \
                     libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev"
        # Fail loudly rather than checking with silently different libraries.
        gdal-config --version && geos-config --version && proj --version

    - name: Install geospatial system dependencies (macOS)
      if: inputs.system-deps == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install pkg-config gdal

    # Homebrew's gdal/proj install does not always leave proj.db on PROJ's
    # default search path. Without it, terra::project()/terra::crs() emit
    # "PROJ: proj_identify: Cannot find proj.db (GDAL error 1)" and any
    # reprojection-touching test fails.
    - name: Configure PROJ data path (macOS)
      if: inputs.system-deps == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        PROJ_PREFIX="$(brew --prefix proj 2>/dev/null || true)"
        PROJ_DATA="$PROJ_PREFIX/share/proj"
        if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/opt/homebrew/share/proj"; fi
        if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/usr/local/share/proj"; fi
        echo "PROJ_DATA=$PROJ_DATA" >> "$GITHUB_ENV"
        echo "PROJ_LIB=$PROJ_DATA"  >> "$GITHUB_ENV"
        echo "Using PROJ_DATA=$PROJ_DATA"
        ls -1 "$PROJ_DATA" | head -5 || true

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        extra-repositories: ${{ inputs.extra-repositories }}
        Ncpus: ${{ inputs.ncpus }}
        use-public-rspm: ${{ inputs.use-public-rspm }}

    # Install everything, Suggests included. Skipping Suggests looks like a free
    # saving on a no-suggests leg, but that leg's guarantee comes from
    # _R_CHECK_DEPENDS_ONLY_=true, which makes R build its own restricted
    # library -- so installing Suggests alongside does NOT weaken it. Meanwhile
    # the test driver calls `library(testthat)` unconditionally and testthat is
    # a Suggests, so dropping them kills the leg before any check output exists.
    # See PredictiveEcology/actions#21.
    - id: deps
      continue-on-error: true
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        pak-version: ${{ inputs.pak-version }}
        cache-version: ${{ inputs.cache-version }}
        dependencies: ${{ inputs.dependencies }}
        working-directory: ${{ inputs.working-directory }}
        extra-packages: ${{ inputs.extra-packages }}

    # Fallback when setup-r-dependencies fails (most often a transient
    # binary-fetch failure under pak). This mirrors the primary step's
    # `dependencies` and `extra-packages` rather than silently checking a
    # narrower set, which is what the previous inline version did.
    - name: Install R deps (retry fallback)
      if: steps.deps.outcome == 'failure'
      uses: nick-fields/retry@v3
      env:
        # Routed through env: rather than interpolated into the command, so a
        # quote or newline in an input cannot break (or extend) the shell line.
        # Same discipline as stage-gdrive-auth. `dependencies` is an R
        # EXPRESSION by contract, so it is eval-parsed, not treated as a string.
        SRD_WORKDIR: ${{ inputs.working-directory }}
        SRD_DEPENDENCIES: ${{ inputs.dependencies }}
        SRD_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      with:
        timeout_minutes: 30
        max_attempts: 3
        retry_wait_seconds: 60
        retry_on: error
        shell: bash
        command: |
          echo "::warning title=Dependency install fell back::setup-r-dependencies failed; retrying with pak directly. The resolved dependency set may differ from the primary path."
          Rscript -e 'install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")' \
                  -e 'setwd(Sys.getenv("SRD_WORKDIR"))' \
                  -e 'deps <- eval(parse(text = Sys.getenv("SRD_DEPENDENCIES")))' \
                  -e 'pak::local_install_dev_deps(ask = FALSE, dependencies = deps)' \
                  -e 'extra <- Filter(nzchar, trimws(strsplit(Sys.getenv("SRD_EXTRA_PACKAGES"), "\n")[[1]]))' \
                  -e 'if (length(extra)) pak::pkg_install(extra, ask = FALSE)'

    - name: Install additional package dependencies
      if: inputs.post-install != ''
      shell: Rscript {0}
      run: ${{ inputs.post-install }}

    # RcppParallel bundles TBB and its ABI is a property of the RcppParallel
    # build, not the toolchain. When RcppParallel changes that ABI, every
    # package linking it must be rebuilt -- 6.0.0 (2026-07-23) moved to oneTBB
    # 2022.0.0 and its NEWS says as much. Repositories that have not yet
    # rebuilt still serve binaries against the old ABI; those install without
    # complaint and only fail at `dlopen`. When such a package is in Imports,
    # this kills `R CMD build` before any check output exists.
    #
    # Probe rather than pin a version: we cannot know which release fixes a
    # given mismatch, but we can ask whether it loads. A no-op once the
    # binaries are healthy, so it needs no maintenance. RcppParallel itself is
    # excluded -- building it from source needs cmake.
    - name: Rebuild RcppParallel-linked packages that fail to load
      shell: Rscript {0}
      run: |
        ip <- installed.packages()
        links <- vapply(rownames(ip), function(p)
          any(grepl("\\bRcppParallel\\b", ip[p, c("Depends", "Imports", "LinkingTo")])),
          logical(1))
        cands <- setdiff(rownames(ip)[links], "RcppParallel")
        loads <- function(p) requireNamespace(p, quietly = TRUE)
        broken <- Filter(Negate(loads), cands)
        if (length(broken)) {
          message("These link RcppParallel ", packageVersion("RcppParallel"),
                  " but fail to load; rebuilding from source: ",
                  paste(broken, collapse = ", "))
          # dependencies first, so e.g. stringfish is rebuilt before qs2 --
          # rebuilding against a still-broken dependency just fails again
          deps <- tools::package_dependencies(broken, db = ip, recursive = TRUE)
          nDeps <- vapply(broken, function(p) sum(broken %in% deps[[p]]), integer(1))
          for (p in broken[order(nDeps)]) install.packages(p, type = "source")
          stillBroken <- Filter(Negate(loads), broken)
          if (length(stillBroken))
            stop("still failing to load after a source rebuild: ",
                 paste(stillBroken, collapse = ", "))
        }
