name: 'install-apt-packages'
description: >-
  Install Ubuntu system packages with apt, capped and retried, and cache the
  downloaded .deb files between runs. Linux only; a no-op elsewhere.
author: 'PredictiveEcology'

inputs:
  packages:
    description: "Whitespace-separated apt package names."
    required: true
  cache:
    description: "Cache the downloaded .deb files and apt lists with actions/cache."
    required: false
    default: "true"

outputs:
  cache-hit:
    description: "'true' when the .deb files came from the cache."
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    ## One place for the apt settings, the retry helper and the package cache.
    ## install-spatial-deps and setup-r-deps call this instead of carrying
    ## their own apt blocks.
    - name: Prepare apt
      id: prep
      if: runner.os == 'Linux'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        USE_CACHE: ${{ inputs.cache }}
      run: |
        set -uo pipefail
        list="$(printf '%s\n' $PACKAGES | sort -u | tr '\n' ' ')"
        list="${list% }"
        [ -n "$list" ] || { echo "::error::install-apt-packages: no packages given"; exit 1; }

        ## Composite-action steps cannot use `timeout-minutes`, so an unreachable
        ## mirror stalls until GitHub's 6h ceiling (two LandWebUtils jobs, 2026-08-19).
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
        ## Runner images may delete downloaded .debs after install (docker-clean,
        ## Keep-Downloaded-Packages); without them there is nothing to cache.
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        printf 'APT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-keep-debs > /dev/null

        dir="${RUNNER_TEMP}/apt-package-cache"
        mkdir -p "$dir/debs"
        . /etc/os-release
        hash="$(printf '%s' "$list" | sha256sum | cut -c1-16)"
        {
          echo "list=$list"
          echo "dir=$dir"
          echo "key=apt-${RUNNER_OS}-${RUNNER_ARCH}-${VERSION_ID}-${ImageVersion:-noimage}-${hash}"
          echo "cache=${USE_CACHE}"
        } >> "$GITHUB_OUTPUT"

    ## A cache problem must never fail the job: restore and save are both
    ## continue-on-error, and a miss just means apt downloads as before.
    - name: Restore apt package cache
      id: restore
      if: runner.os == 'Linux' && inputs.cache == 'true'
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.prep.outputs.dir }}/debs/*.deb
          ${{ steps.prep.outputs.dir }}/lists.tar
        key: ${{ steps.prep.outputs.key }}

    - name: Install apt packages
      id: install
      if: runner.os == 'Linux'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
        LIST: ${{ steps.prep.outputs.list }}
        DIR: ${{ steps.prep.outputs.dir }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        set -uo pipefail
        ## Each apt call is wrapped in `timeout` and retried.
        retry() {
          local n
          for n in 1 2 3; do
            if timeout --kill-after=60s "$1" bash -c "$2"; then
              return 0
            fi
            echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
            sleep $((n * 15))
          done
          echo "::error::'$2' still failing after 3 attempts"
          return 1
        }
        install_cmd="sudo -E apt-get install -y --no-install-recommends -o Dir::Cache::Archives=$DIR/debs $LIST"
        done_=false
        if [ "$HIT" = "true" ] && [ -f "$DIR/lists.tar" ]; then
          ## Lists and .debs were saved together, so they agree on versions and
          ## apt can install from local files without touching the mirror.
          echo "::group::apt cache hit: installing from local files"
          if sudo tar -C /var/lib/apt -xf "$DIR/lists.tar" && timeout --kill-after=60s 10m bash -c "$install_cmd"; then
            done_=true
          else
            echo "::warning::install from the apt cache failed; falling back to a normal update and install"
          fi
          echo "::endgroup::"
        fi
        if [ "$done_" != "true" ]; then
          retry 5m  "sudo -E apt-get update -y"
          retry 10m "$install_cmd"
        fi
        ## What the next run will restore. Created only when this run had to download.
        if [ "$HIT" != "true" ] && ls "$DIR"/debs/*.deb > /dev/null 2>&1; then
          sudo tar -C /var/lib/apt --exclude=lists/lock --exclude=lists/partial -cf "$DIR/lists.tar" lists \
            && sudo chown "$(id -u):$(id -g)" "$DIR/lists.tar" && echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save apt package cache
      if: runner.os == 'Linux' && inputs.cache == 'true' && steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.save == 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.prep.outputs.dir }}/debs/*.deb
          ${{ steps.prep.outputs.dir }}/lists.tar
        key: ${{ steps.prep.outputs.key }}
