name: 'install-spatial-deps'
description: 'Action to install system dependencies of geospatial packages'
author: 'Alex Chubaty'

inputs:
  extra-apt-packages:
    description: >-
      Further Linux apt packages (whitespace-separated) to install in the same
      apt transaction, so a caller needing more system packages pays for one
      download and one cache entry rather than several. Ignored off Linux.
    required: false
    default: ""

outputs:
  abi:
    description: >-
      Identity of the geospatial libraries actually installed, as
      `gdal<v>-geos<v>-proj<v>`. Empty on Windows, where these libraries are
      bundled into the R binaries rather than provided by the system.

      Exists so a caller can make a cached build artefact depend on the
      libraries that artefact is LINKED against. An R package's compiled code
      binds to a specific GDAL soname, and nothing about that binding appears
      in the package version, the R version or the OS label -- so a cache keyed
      on those alone can hand a job a library built against a GDAL the runner
      no longer has. See `setup-r-deps`, which folds this into its cache key.
    value: ${{ steps.abi.outputs.abi }}

runs:
  using: "composite"
  steps:
      ## Referenced by full name, not `./`: inside a composite action a relative
      ## `uses:` resolves against the CALLER's checkout (see setup-r-deps).
      ##
      ## The apt block (timeouts, capped retries, no ubuntugis PPA, the .deb
      ## cache) lives in install-apt-packages. NO ubuntugis-unstable PPA: it
      ## installs libgdal37 (GDAL 3.11.x), but Posit's noble binary cache builds
      ## quickPlot/sf/terra against the Ubuntu-default libgdal34 -- the ABI
      ## mismatch surfaces as `libgdal.so.34: cannot open shared object file`
      ## when quickPlot loads, and fails the whole check via a lazy-load.
      - name: Install geospatial system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: PredictiveEcology/actions/install-apt-packages@main
        with:
          packages: pkg-config libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev ${{ inputs.extra-apt-packages }}
      - name: Check the geospatial libraries (Linux)
        if: runner.os == 'Linux'
        ## Fail loudly rather than proceeding with silently different libraries.
        run: gdal-config --version && geos-config --version && pkg-config --modversion proj
        shell: bash
      - name: Install geospatial system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config gdal
        shell: bash
      ## Homebrew's gdal/proj install does not always leave proj.db on PROJ's
      ## default search path. Without it, terra::project()/terra::crs() emit
      ## "PROJ: proj_identify: Cannot find proj.db (GDAL error 1)" and any
      ## reprojection-touching test fails. The reusable workflows already did
      ## this; this action did not, so its consumers hit the failure.
      - name: Configure PROJ data path (macOS)
        if: runner.os == 'macOS'
        run: |
          PROJ_PREFIX="$(brew --prefix proj 2>/dev/null || true)"
          PROJ_DATA="$PROJ_PREFIX/share/proj"
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/opt/homebrew/share/proj"; fi
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/usr/local/share/proj"; fi
          echo "PROJ_DATA=$PROJ_DATA" >> "$GITHUB_ENV"
          echo "PROJ_LIB=$PROJ_DATA"  >> "$GITHUB_ENV"
          echo "Using PROJ_DATA=$PROJ_DATA"
          ls -1 "$PROJ_DATA" | head -5 || true
        shell: bash

      ## Report the ABI the rest of the job will be building against.
      ##
      ## Deliberately derived from the tools rather than from the package
      ## manager: `gdal-config` is the same thing the R packages' configure
      ## scripts consult, so this is the version they will actually link, on
      ## both Linux and macOS, however it got installed.
      ##
      ## Windows is intentionally excluded, not unimplemented. There is no
      ## system GDAL there -- rwinlib/Rtools bundles the geospatial libraries
      ## into the package binaries -- so there is no ABI for the runner to
      ## drift against, and an empty output means "no constraint".
      ## MUST NOT fail the job. This runs in an action that ~30 repositories
      ## depend on, and its output is an optimisation -- a cache discriminator --
      ## not something any build needs to proceed. If a probe is unavailable the
      ## correct outcome is an empty ABI, which means "no constraint" and
      ## reproduces exactly the pre-existing cache behaviour, NOT a red run
      ## across the organisation.
      ##
      ## Concretely: the macOS branch above installs only `pkg-config gdal`, so
      ## `geos-config` and PROJ's .pc file are present only as transitive brew
      ## dependencies. That is true today and is not a contract. Hence every
      ## probe is individually guarded and the whole step is `|| true`-shaped
      ## rather than `set -e`.
      ##
      ## A partial ABI is deliberately still emitted: `gdal3.8.4` alone
      ## discriminates the case that actually bites (the GDAL soname), and a
      ## missing GEOS/PROJ probe should not throw that away.
      - name: Identify the geospatial ABI
        id: abi
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail

          probe() {
            local out
            if out="$("$@" 2>/dev/null)" && [ -n "$out" ]; then
              printf '%s' "$out" | tr -d '[:space:]'
            fi
          }

          gdal="$(probe gdal-config --version)"
          geos="$(probe geos-config --version)"
          proj="$(probe pkg-config --modversion proj)"

          abi=""
          [ -n "$gdal" ] && abi="gdal${gdal}"
          [ -n "$geos" ] && abi="${abi:+${abi}-}geos${geos}"
          [ -n "$proj" ] && abi="${abi:+${abi}-}proj${proj}"

          if [ -z "$abi" ]; then
            echo "::warning::could not identify any geospatial library version; \
          the dependency cache key will not be ABI-specific for this job"
          fi

          echo "abi=$abi" >> "$GITHUB_OUTPUT"
          echo "geospatial ABI: ${abi:-<none>}"
