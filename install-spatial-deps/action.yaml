name: 'install-spatial-deps'
description: 'Action to install system dependencies of geospatial packages'
author: 'Alex Chubaty'
runs:
  using: "composite"
  steps:
      - name: Install geospatial system dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          ## an unattended apt-get can otherwise block indefinitely on a debconf prompt
          DEBIAN_FRONTEND: noninteractive
        run: |
          ## Each apt call is wrapped in `timeout` and retried. Composite-action steps do NOT
          ## support `timeout-minutes`, so without this a slow/unreachable ubuntugis PPA or apt
          ## mirror simply stalls -- and with no cap the job burns GitHub's full 6h ceiling before
          ## anyone finds out. That happened on 2026-08-19: two LandWebUtils jobs sat here for
          ## 6h0m and were killed, while every other ubuntu job in the same matrix was degraded
          ## (devel took 56m against its usual ~8m). A rerun of the identical commit passed in
          ## 6-9m, i.e. the PPA/mirrors were transiently unhealthy, not the package.
          retry() {
            local n
            for n in 1 2 3; do
              if timeout "$1" bash -c "$2"; then
                return 0
              fi
              echo "::warning::'$2' failed or timed out (attempt $n/3); retrying..."
              sleep $((n * 15))
            done
            echo "::error::'$2' still failing after 3 attempts"
            return 1
          }
          retry 5m  "sudo -E add-apt-repository -y ppa:ubuntugis/ubuntugis-unstable"
          retry 5m  "sudo -E apt-get update -y"
          retry 10m "sudo -E apt-get install -y \
                       libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev"
        shell: bash
      - name: Install geospatial system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          brew install gdal
        shell: zsh {0}
